<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROX | R6 Avatar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
    <style>
        :root {
            --bg: #030106;
            --accent: #9d4edd;
            --accent-glow: #c77dff;
            --coin: #ffcc00;
            --text: #ffffff;
            --dim: #7d7d7d;
            --glass: rgba(18, 9, 32, 0.6);
            --border: rgba(255, 255, 255, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            background: radial-gradient(circle at 50% 40%, rgba(157,78,221,0.15) 0%, var(--bg) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Viewport */
        .viewport {
            width: 100vw;
            height: 100vh;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            cursor: grab;
        }
        .viewport:active { cursor: grabbing; }

        /* Сцена */
        .scene {
            width: 200px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-15deg) rotateY(-30deg);
            transition: transform 0.05s linear;
        }

        /* Кубы */
        .cube {
            position: absolute;
            transform-style: preserve-3d;
            transform-origin: top center;
        }
        .face {
            position: absolute;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.25);
        }

        /* BROX-цвета */
        :root {
            --skin: #f5cba7;
            --torso: #9d4edd;
            --legs: #2c3e50;
        }

        /* Голова */
        .head { width: 50px; height: 50px; top: 50px; left: 75px; transform-origin: bottom center; }
        .head .face { width: 50px; height: 50px; background: var(--skin); }
        .head .front { transform: translateZ(25px); display: flex; gap: 12px; justify-content: center; align-items: center; }
        .head .back { transform: rotateY(180deg) translateZ(25px); }
        .head .left { transform: rotateY(-90deg) translateZ(25px); }
        .head .right { transform: rotateY(90deg) translateZ(25px); }
        .head .top { transform: rotateX(90deg) translateZ(25px); }
        .head .bottom { transform: rotateX(-90deg) translateZ(25px); }
        .eye { width: 8px; height: 12px; background: #111; border-radius: 1px; animation: blink 4s infinite; }
        @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(0)} }

        /* Торс */
        .torso { width: 76px; height: 120px; top: 102px; left: 62px; }
        .torso .face { background: var(--torso); }
        .torso .front,.torso .back { width:76px; height:120px; }
        .torso .left,.torso .right { width:40px; height:120px; background:#7b2dd4; }
        .torso .top,.torso .bottom { width:76px; height:40px; }
        .torso .front { transform:translateZ(20px); }
        .torso .back { transform:rotateY(180deg) translateZ(20px); }
        .torso .left { transform:rotateY(-90deg) translateZ(20px); }
        .torso .right { transform:rotateY(90deg) translateZ(56px); }
        .torso .top { transform:rotateX(90deg) translateZ(20px); }
        .torso .bottom { transform:rotateX(-90deg) translateZ(100px); }

        /* Руки */
        .arm { width:26px; height:110px; top:102px; }
        .arm .face { background: var(--skin); }
        .arm .front,.arm .back { width:26px; height:110px; }
        .arm .left,.arm .right { width:30px; height:110px; background:#e0b090; }
        .arm .top,.arm .bottom { width:26px; height:30px; }
        .arm .front { transform:translateZ(15px); }
        .arm .back { transform:rotateY(180deg) translateZ(15px); }
        .arm .left { transform:rotateY(-90deg) translateZ(15px); }
        .arm .right { transform:rotateY(90deg) translateZ(11px); }
        .arm .top { transform:rotateX(90deg) translateZ(15px); }
        .arm .bottom { transform:rotateX(-90deg) translateZ(95px); }
        .left-arm { left:32px; }
        .right-arm { left:142px; }

        /* Ноги */
        .leg { width:34px; height:120px; top:222px; }
        .leg .face { background: var(--legs); }
        .leg .front,.leg .back { width:34px; height:120px; }
        .leg .left,.leg .right { width:34px; height:120px; background:#1a2a38; }
        .leg .top,.leg .bottom { width:34px; height:34px; }
        .leg .front { transform:translateZ(17px); }
        .leg .back { transform:rotateY(180deg) translateZ(17px); }
        .leg .left { transform:rotateY(-90deg) translateZ(17px); }
        .leg .right { transform:rotateY(90deg) translateZ(17px); }
        .leg .top { transform:rotateX(90deg) translateZ(17px); }
        .leg .bottom { transform:rotateX(-90deg) translateZ(103px); }
        .left-leg { left:63px; }
        .right-leg { left:103px; }

        .shadow {
            position:absolute; width:150px; height:60px; background:rgba(0,0,0,0.4);
            border-radius:50%; bottom:-30px; left:25px; transform:rotateX(90deg) translateZ(-50px); filter:blur(10px);
        }

        /* Меню анимаций */
        .menu {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--glass);
            backdrop-filter: blur(30px);
            padding: 24px;
            border-radius: 18px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            width: 200px;
        }
        .menu h3 {
            color: var(--accent-glow);
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 8px;
            text-align: center;
        }
        .btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            color: var(--dim);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }
        .btn:hover {
            border-color: var(--accent-glow);
            color: #fff;
            background: rgba(157,78,221,0.08);
            transform: translateX(4px);
        }
        .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(157,78,221,0.3);
        }

        /* Анимации */
        .anim-idle .scene { animation: breathe 4s ease-in-out infinite alternate; }
        @keyframes breathe {
            0% { transform: rotateX(-15deg) rotateY(var(--ry)) translateY(0); }
            100% { transform: rotateX(-18deg) rotateY(var(--ry)) translateY(-4px); }
        }
        .anim-idle .left-arm { transform: rotateX(5deg); }
        .anim-idle .right-arm { transform: rotateX(-5deg); }

        .anim-walk .left-leg { animation: r6-swing 1.4s ease-in-out infinite alternate; }
        .anim-walk .right-leg { animation: r6-swing 1.4s ease-in-out infinite alternate-reverse; }
        .anim-walk .left-arm { animation: r6-swing 1.4s ease-in-out infinite alternate-reverse; }
        .anim-walk .right-arm { animation: r6-swing 1.4s ease-in-out infinite alternate; }
        @keyframes r6-swing { 0%{transform:rotateX(-25deg)} 100%{transform:rotateX(25deg)} }

        .anim-run .torso { animation: run-bob 0.6s ease-in-out infinite alternate; }
        .anim-run .left-leg { animation: r6-run 0.6s ease-in-out infinite alternate; }
        .anim-run .right-leg { animation: r6-run 0.6s ease-in-out infinite alternate-reverse; }
        .anim-run .left-arm { animation: r6-run 0.6s ease-in-out infinite alternate-reverse; }
        .anim-run .right-arm { animation: r6-run 0.6s ease-in-out infinite alternate; }
        @keyframes r6-run { 0%{transform:rotateX(-40deg)} 100%{transform:rotateX(40deg)} }
        @keyframes run-bob { 0%{transform:translateY(0) rotateX(5deg)} 100%{transform:translateY(-8px) rotateX(8deg)} }

        .anim-jump .scene { animation: jump-up 1.2s cubic-bezier(0.25,0.46,0.45,0.94) infinite; }
        .anim-jump .left-arm { transform: rotateX(160deg) rotateZ(-10deg); }
        .anim-jump .right-arm { transform: rotateX(160deg) rotateZ(10deg); }
        .anim-jump .left-leg { transform: rotateX(-10deg); }
        .anim-jump .right-leg { transform: rotateX(10deg); }
        @keyframes jump-up { 0%,100%{transform:rotateX(-15deg) rotateY(var(--ry)) translateY(0)} 50%{transform:rotateX(-15deg) rotateY(var(--ry)) translateY(-70px)} }

        .anim-fall .scene { animation: float-fall 2s ease-in-out infinite alternate; }
        .anim-fall .left-arm { transform: rotateX(120deg) rotateZ(-30deg); }
        .anim-fall .right-arm { transform: rotateX(120deg) rotateZ(30deg); }
        .anim-fall .left-leg { transform: rotateX(30deg) rotateZ(-10deg); }
        .anim-fall .right-leg { transform: rotateX(-20deg) rotateZ(10deg); }
        @keyframes float-fall { 0%{transform:rotateX(-10deg) rotateY(var(--ry)) translateY(-20px)} 100%{transform:rotateX(-20deg) rotateY(var(--ry)) translateY(-10px)} }

        .anim-climb .torso { animation: climb-up 1.6s linear infinite; }
        .anim-climb .left-arm { animation: r6-climb 0.8s ease-in-out infinite alternate; }
        .anim-climb .right-arm { animation: r6-climb 0.8s ease-in-out infinite alternate-reverse; }
        .anim-climb .left-leg { animation: r6-climb 0.8s ease-in-out infinite alternate-reverse; }
        .anim-climb .right-leg { animation: r6-climb 0.8s ease-in-out infinite alternate; }
        @keyframes r6-climb { 0%{transform:rotateX(45deg)} 100%{transform:rotateX(-20deg)} }
        @keyframes climb-up { 0%{transform:translateY(15px)} 100%{transform:translateY(-15px)} }
    </style>
</head>
<body class="anim-idle">

    <div class="menu">
        <h3>Анимации R6</h3>
        <button class="btn active" onclick="setAnim('idle', this)">Покой</button>
        <button class="btn" onclick="setAnim('walk', this)">Ходьба</button>
        <button class="btn" onclick="setAnim('run', this)">Бег</button>
        <button class="btn" onclick="setAnim('jump', this)">Прыжок</button>
        <button class="btn" onclick="setAnim('fall', this)">Падение</button>
        <button class="btn" onclick="setAnim('climb', this)">Лестница</button>
    </div>

    <div class="viewport" id="viewport">
        <div class="scene" id="scene">
            <div class="shadow"></div>

            <div class="cube head">
                <div class="face front"><div class="eye"></div><div class="eye"></div></div>
                <div class="face back"></div><div class="face left"></div>
                <div class="face right"></div><div class="face top"></div>
                <div class="face bottom"></div>
            </div>

            <div class="cube torso">
                <div class="face front"></div><div class="face back"></div>
                <div class="face left"></div><div class="face right"></div>
                <div class="face top"></div><div class="face bottom"></div>
            </div>

            <div class="cube arm left-arm">
                <div class="face front"></div><div class="face back"></div>
                <div class="face left"></div><div class="face right"></div>
                <div class="face top"></div><div class="face bottom"></div>
            </div>

            <div class="cube arm right-arm">
                <div class="face front"></div><div class="face back"></div>
                <div class="face left"></div><div class="face right"></div>
                <div class="face top"></div><div class="face bottom"></div>
            </div>

            <div class="cube leg left-leg">
                <div class="face front"></div><div class="face back"></div>
                <div class="face left"></div><div class="face right"></div>
                <div class="face top"></div><div class="face bottom"></div>
            </div>

            <div class="cube leg right-leg">
                <div class="face front"></div><div class="face back"></div>
                <div class="face left"></div><div class="face right"></div>
                <div class="face top"></div><div class="face bottom"></div>
            </div>
        </div>
    </div>

    <script>
        function setAnim(animName, btn) {
            document.body.className = '';
            document.body.classList.add('anim-' + animName);
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const viewport = document.getElementById('viewport');
        const scene = document.getElementById('scene');
        
        let targetRotationY = -30;
        let targetRotationX = -15;
        document.documentElement.style.setProperty('--ry', targetRotationY + 'deg');

        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;

        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMouseX;
            const deltaY = e.clientY - previousMouseY;
            targetRotationY += deltaX * 0.5;
            targetRotationX = Math.max(-45, Math.min(45, targetRotationX - deltaY * 0.5));
            document.documentElement.style.setProperty('--ry', targetRotationY + 'deg');
            scene.style.transform = `rotateX(${targetRotationX}deg) rotateY(${targetRotationY}deg)`;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);
    </script>
</body>
</html>
