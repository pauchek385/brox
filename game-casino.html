<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>spark — Минер 💣</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #08080f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      background-image: radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, #08080f 60%);
    }

    :root {
      --bg-panel: rgba(18, 18, 32, 0.92);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --accent-gem: #10b981;
      --accent-bomb: #ef4444;
      --gold: #fbbf24;
      --btn-start: linear-gradient(145deg, #10b981 0%, #059669 100%);
      --btn-cashout: linear-gradient(145deg, #f59e0b 0%, #d97706 100%);
      --btn-reset: linear-gradient(145deg, #6366f1 0%, #4f46e5 100%);
    }

    .main-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border-radius: 32px;
      padding: 20px 16px 24px;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    @media (min-width: 700px) {
      body {
        padding: 24px;
        align-items: center;
      }
      .main-container {
        flex-direction: row;
        max-width: 800px;
        width: fit-content;
        padding: 24px;
        gap: 24px;
      }
      .control-panel {
        width: 260px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .game-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
    }

    .control-panel, .game-area {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .logo-icon {
      font-size: 24px;
      filter: drop-shadow(0 0 10px #ef4444aa);
    }
    .game-label {
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .game-name {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .balance-box { text-align: right; }
    .balance-amount {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
    }
    .coin-icon {
      width: 16px;
      height: 16px;
      background: radial-gradient(circle at 30% 30%, #ffffff, #fbbf24);
      border-radius: 50%;
      box-shadow: 0 0 8px #fbbf24;
    }

    .section-heading {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .bet-row {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 10px 14px;
      gap: 10px;
    }
    .bet-field {
      background: transparent;
      border: none;
      font-size: 17px;
      font-weight: 700;
      color: white;
      width: 100%;
      outline: none;
    }
    .chip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.02);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .bomb-row {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 4px;
      border: 1px solid var(--border-subtle);
      gap: 2px;
    }
    .bomb-option {
      flex: 1;
      background: transparent;
      border: none;
      color: #64748b;
      padding: 10px 0;
      border-radius: 11px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .bomb-option.active {
      background: #1f1f30;
      color: white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }
    .bomb-option:disabled { opacity: 0.25; pointer-events: none; }

    .stats-row { display: flex; gap: 10px; }
    .stat-card {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 1;
    }
    .stat-num { font-size: 20px; font-weight: 800; }
    .stat-num.green { color: var(--accent-gem); }
    .stat-num.red { color: var(--accent-bomb); }

    .action-btn {
      width: 100%;
      background: var(--btn-start);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 16px;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(0,0,0,0.4);
    }
    .action-btn.cashout { background: var(--btn-cashout); }
    .action-btn.reset { background: var(--btn-reset); }
    .action-btn:disabled { opacity: 0.5; pointer-events: none; }
    .action-btn:active { transform: scale(0.97); }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: rgba(0,0,0,0.25);
      padding: 10px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }
    .tile-cell {
      aspect-ratio: 1 / 1;
      perspective: 600px;
    }
    .tile-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.25s ease;
      cursor: pointer;
    }
    .tile-front, .tile-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-front {
      background: #1b1b2a;
      border: 1px solid rgba(255,255,255,0.03);
      font-weight: 800;
      font-size: 20px;
      color: rgba(255,255,255,0.2);
    }
    .grid-active .tile-front {
      background: #2e2533;
      border-color: rgba(249,115,22,0.5);
      color: rgba(255,255,255,0.6);
    }
    .tile-back {
      background: #141420;
      transform: rotateY(180deg);
    }
    .tile-cell.revealed .tile-inner { transform: rotateY(180deg); }
    .tile-cell.revealed { pointer-events: none; }

    .ribbon-scroll {
      overflow-x: auto;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      padding: 8px 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .ribbon-scroll::-webkit-scrollbar { display: none; }
    .ribbon-track { display: flex; gap: 6px; padding: 0 6px; }
    .mult-chip {
      min-width: 55px;
      background: rgba(255,255,255,0.02);
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
      opacity: 0.35;
    }
    .mult-chip.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-gem);
      opacity: 1;
    }
    .mult-cash { font-weight: 700; font-size: 13px; color: #e2e8f0; }
    .mult-factor { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
    .mult-chip.active .mult-factor { color: var(--accent-gem); font-weight: 800; }

    .exit-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #f87171;
      font-weight: 600;
      padding: 12px;
      border-radius: 40px;
      font-size: 14px;
      cursor: pointer;
    }

    .shake { animation: shake 0.25s ease-in-out 2; }
    @keyframes shake {
      0%,100%{ transform: translate(0,0); }
      25%{ transform: translate(-5px,2px); }
      50%{ transform: translate(5px,-2px); }
      75%{ transform: translate(-3px,0); }
    }
  </style>
</head>
<body>
<div class="main-container" id="mainContainer">
  <div class="control-panel">
    <div class="top-bar">
      <div>
        <span style="font-size:24px;">💣</span>
        <div class="game-label">МИНИ-ИГРА</div>
        <div class="game-name">Минер</div>
      </div>
      <div class="balance-box">
        <div class="game-label">БАЛАНС</div>
        <div class="balance-amount">
          <span class="coin-icon"></span>
          <span id="balanceDisplay">0</span>
        </div>
      </div>
    </div>

    <div>
      <div class="section-heading">Сумма ставки</div>
      <div class="bet-row">
        <input type="number" class="bet-field" id="betInput" value="100" min="10">
        <div style="display:flex; gap:4px;">
          <button class="chip-btn" id="plus10">+10</button>
          <button class="chip-btn" id="plus50">+50</button>
          <button class="chip-btn" id="maxBet">МАКС</button>
        </div>
      </div>
    </div>

    <div>
      <div class="section-heading">Бомбы</div>
      <div class="bomb-row" id="bombSelector">
        <button class="bomb-option active" data-bombs="3">3</button>
        <button class="bomb-option" data-bombs="5">5</button>
        <button class="bomb-option" data-bombs="10">10</button>
        <button class="bomb-option" data-bombs="20">20</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div><span class="game-label">РУБИНЫ</span><div class="stat-num green" id="gemsCount">22</div></div>
        <span>💎</span>
      </div>
      <div class="stat-card">
        <div><span class="game-label">БОМБЫ</span><div class="stat-num red" id="bombsCount">3</div></div>
        <span>💣</span>
      </div>
    </div>

    <button class="action-btn" id="mainActionBtn">СТАРТ</button>
    <button class="exit-btn" id="exithomeBtn">← В ЛОББИ</button>
  </div>

  <div class="game-area">
    <div class="grid-container" id="minesGrid"></div>
    <div class="ribbon-scroll">
      <div class="ribbon-track" id="multiplierRibbon"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getDatabase, ref, get, runTransaction, set, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
    authDomain: "spark-9e768.firebaseapp.com",
    databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "spark-9e768",
    storageBucket: "spark-9e768.firebasestorage.app",
    messagingSenderId: "660066059407",
    appId: "1:660066059407:web:0d87f09259e53563555cfa"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const nick = localStorage.getItem('spark_user');
  if (!nick) window.location.href = '/';
  const userRef = ref(db, `users/${nick}`);

  // Простой онлайн-статус
  const onlineRef = ref(db, `users/${nick}/online`);
  set(onlineRef, true);
  onDisconnect(onlineRef).set(false);
  setInterval(() => set(onlineRef, true), 30000);

  const GRID_SIZE = 25;
  const GEM_ICON = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 2L3.5 9L12 21.5L20.5 9L12 2Z" fill="#10b981"/><path d="M12 2L8.5 9L12 21.5L15.5 9L12 2Z" fill="#34d399"/></svg>`;
  const BOMB_ICON = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="13" r="8" fill="#ef4444"/><circle cx="9" cy="10" r="2" fill="#fca5a5"/><path d="M16 8L18.5 5.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/></svg>`;

  const balanceDisplay = document.getElementById('balanceDisplay');
  const betInput = document.getElementById('betInput');
  const gemsCountEl = document.getElementById('gemsCount');
  const bombsCountEl = document.getElementById('bombsCount');
  const mainBtn = document.getElementById('mainActionBtn');
  const gridEl = document.getElementById('minesGrid');
  const ribbonEl = document.getElementById('multiplierRibbon');
  const mainContainer = document.getElementById('mainContainer');

  let balance = 0;
  let currentBet = 100;
  let numBombs = 3;
  let gamePhase = 'idle';
  let minesMap = [];
  let openedGems = 0;
  let processing = false;

  async function refreshBalance() {
    const snap = await get(userRef);
    balance = snap.val()?.sparkCoins ?? 2500; // только если undefined/null
    balanceDisplay.textContent = balance.toLocaleString('en-US');
  }

  function combinations(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    let res = 1;
    for (let i = 1; i <= k; i++) res = res * (n - k + i) / i;
    return res;
  }

  function calcMultiplier(steps) {
    if (steps <= 0) return 0;
    const totalGems = GRID_SIZE - numBombs;
    if (steps > totalGems) return 0;
    return (combinations(GRID_SIZE, steps) / combinations(totalGems, steps)) * 0.97;
  }

  function clampBet(val) {
    return Math.min(Math.max(val, 10), Math.min(balance, 10000));
  }

  function updateStats() {
    gemsCountEl.textContent = gamePhase === 'playing' ? openedGems : GRID_SIZE - numBombs;
    bombsCountEl.textContent = numBombs;
  }

  function drawGrid() {
    gridEl.innerHTML = '';
    for (let i = 0; i < GRID_SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'tile-cell';
      cell.innerHTML = `<div class="tile-inner"><div class="tile-front">?</div><div class="tile-back"></div></div>`;
      cell.addEventListener('click', () => tileClick(i));
      gridEl.appendChild(cell);
    }
  }

  function renderRibbon() {
    ribbonEl.innerHTML = '';
    const totalGems = GRID_SIZE - numBombs;
    for (let step = 1; step <= Math.max(5, totalGems); step++) {
      const mult = calcMultiplier(step);
      const chip = document.createElement('div');
      const active = (gamePhase === 'playing' ? step === openedGems + 1 : step === openedGems) && step <= totalGems;
      chip.className = `mult-chip${active ? ' active' : ''}`;
      chip.innerHTML = step > totalGems
        ? `<div class="mult-cash">—</div><div class="mult-factor">🔒</div>`
        : `<div class="mult-cash">${Math.floor(currentBet * mult)}</div><div class="mult-factor">x${mult.toFixed(2)}</div>`;
      ribbonEl.appendChild(chip);
    }
    const activeChip = ribbonEl.querySelector('.mult-chip.active');
    if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  function updateUI() {
    balanceDisplay.textContent = balance.toLocaleString('en-US');
    betInput.disabled = gamePhase !== 'idle';
    document.querySelectorAll('.bomb-option').forEach(b => b.disabled = gamePhase !== 'idle');
    updateStats();

    if (gamePhase === 'idle') {
      mainBtn.textContent = 'СТАРТ';
      mainBtn.className = 'action-btn';
      // Блокируем кнопку, если баланс 0 или ставка больше баланса
      mainBtn.disabled = (balance <= 0 || currentBet > balance || currentBet <= 0);
    } else if (gamePhase === 'playing') {
      const cash = Math.floor(currentBet * calcMultiplier(openedGems));
      mainBtn.textContent = openedGems === 0 ? 'Откройте ячейку' : `ЗАБРАТЬ ${cash} фишек`;
      mainBtn.className = 'action-btn cashout';
      mainBtn.disabled = openedGems === 0;
    } else if (gamePhase === 'lost') {
      mainBtn.textContent = '💥 ВЗРЫВ! Играть ещё';
      mainBtn.className = 'action-btn reset';
      mainBtn.disabled = false;
    } else if (gamePhase === 'won') {
      const cash = Math.floor(currentBet * calcMultiplier(openedGems));
      mainBtn.textContent = `🏆 ВЫИГРЫШ ${cash} фишек`;
      mainBtn.className = 'action-btn reset';
      mainBtn.disabled = false;
    }
    renderRibbon();
  }

  async function startGame() {
    if (processing) return;
    if (balance <= 0 || currentBet > balance || currentBet <= 0) {
      alert('Недостаточно фишек!');
      return;
    }
    processing = true;
    try {
      await refreshBalance();
      currentBet = clampBet(parseInt(betInput.value) || currentBet);
      betInput.value = currentBet;

      if (balance < currentBet || currentBet <= 0) {
        alert('Недостаточно фишек!');
        return;
      }

      await runTransaction(userRef, (data) => {
        const current = data?.sparkCoins ?? 2500;
        data.sparkCoins = current - currentBet;
        return data;
      });
      await refreshBalance();

      gamePhase = 'playing';
      openedGems = 0;
      gridEl.classList.add('grid-active');
      minesMap = Array(GRID_SIZE).fill(false);
      let placed = 0;
      while (placed < numBombs) {
        const idx = Math.floor(Math.random() * GRID_SIZE);
        if (!minesMap[idx]) { minesMap[idx] = true; placed++; }
      }
      drawGrid();
      updateUI();
    } finally {
      processing = false;
    }
  }

  function tileClick(index) {
    if (gamePhase !== 'playing' || processing) return;
    const cell = gridEl.children[index];
    if (!cell || cell.classList.contains('revealed')) return;

    cell.classList.add('revealed');
    const back = cell.querySelector('.tile-back');

    if (minesMap[index]) {
      gamePhase = 'lost';
      back.innerHTML = BOMB_ICON;
      mainContainer.classList.add('shake');
      setTimeout(() => mainContainer.classList.remove('shake'), 300);
      revealAll();
      updateUI();
      return;
    }

    openedGems++;
    back.innerHTML = GEM_ICON;

    if (openedGems === GRID_SIZE - numBombs) {
      cashout();
    } else {
      updateUI();
    }
  }

  function revealAll() {
    minesMap.forEach((bomb, i) => {
      const cell = gridEl.children[i];
      if (!cell || cell.classList.contains('revealed')) return;
      cell.classList.add('revealed');
      cell.querySelector('.tile-back').innerHTML = bomb ? BOMB_ICON : GEM_ICON;
      if (!bomb) cell.querySelector('.tile-back').style.opacity = '0.25';
    });
  }

  async function cashout() {
    if (processing || gamePhase !== 'playing') return;
    processing = true;
    try {
      const mult = calcMultiplier(openedGems);
      const win = Math.floor(currentBet * mult);
      await runTransaction(userRef, (data) => {
        const current = data?.sparkCoins ?? 2500;
        data.sparkCoins = current + win;
        return data;
      });
      await refreshBalance();
      gamePhase = 'won';
      revealAll();
      updateUI();
    } finally {
      processing = false;
    }
  }

  function resetGame() {
    if (processing) return;
    gamePhase = 'idle';
    openedGems = 0;
    gridEl.classList.remove('grid-active');
    drawGrid();
    updateUI();
  }

  mainBtn.addEventListener('click', () => {
    if (gamePhase === 'idle') startGame();
    else if (gamePhase === 'playing') cashout();
    else resetGame();
  });

  document.getElementById('plus10').addEventListener('click', async () => {
    if (gamePhase !== 'idle') return;
    await refreshBalance();
    currentBet = clampBet(currentBet + 10);
    betInput.value = currentBet;
    updateUI();
  });
  document.getElementById('plus50').addEventListener('click', async () => {
    if (gamePhase !== 'idle') return;
    await refreshBalance();
    currentBet = clampBet(currentBet + 50);
    betInput.value = currentBet;
    updateUI();
  });
  document.getElementById('maxBet').addEventListener('click', async () => {
    if (gamePhase !== 'idle') return;
    await refreshBalance();
    currentBet = clampBet(balance);
    betInput.value = currentBet;
    updateUI();
  });

  betInput.addEventListener('change', async () => {
    let val = parseInt(betInput.value);
    if (isNaN(val)) val = 10;
    await refreshBalance();
    currentBet = clampBet(val);
    betInput.value = currentBet;
    updateUI();
  });

  document.getElementById('bombSelector').addEventListener('click', (e) => {
    if (gamePhase !== 'idle') return;
    const btn = e.target.closest('.bomb-option');
    if (!btn) return;
    document.querySelector('.bomb-option.active')?.classList.remove('active');
    btn.classList.add('active');
    numBombs = parseInt(btn.dataset.bombs);
    updateUI();
  });

  document.getElementById('exithomeBtn').addEventListener('click', () => {
    window.location.href = '/home';
  });

  refreshBalance();
  drawGrid();
  updateUI();
</script>
</body>
</html>
