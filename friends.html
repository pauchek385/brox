<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BROX | Friends</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-ultra: #030106;
      --bg-sidebar: rgba(6, 3, 10, 0.99);
      --bg-card: rgba(18, 9, 32, 0.5);
      --accent: #9d4edd;
      --accent-glow: #c77dff;
      --coin: #ffcc00;
      --danger: #ff0055;
      --success: #00ff88;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.07);
      --glass-bright: rgba(255, 255, 255, 0.12);
      --sidebar-w: 320px;
      --text-main: #ffffff;
      --text-dim: #7d7d7d;
      --text-mute: #333333;
      --radius-lg: 35px;
      --radius-md: 22px;
      --transition-main: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    body, html {
      background: var(--bg-ultra); color: var(--text-main); font-family: 'Inter', sans-serif;
      width:100%!important; height:100%!important; min-height:100vh!important; max-height:100vh!important;
      overflow:hidden!important; display:flex;
    }
    ::-webkit-scrollbar { width:4px; height:4px; background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:10px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--accent); }
    .sidebar { width:var(--sidebar-w); height:100vh; background:var(--bg-sidebar); backdrop-filter:blur(60px); border-right:1px solid var(--glass-border); display:flex; flex-direction:column; padding:50px 35px; position:fixed; left:0; top:0; z-index:2000; overflow-y:auto; }
    .brand-box { margin-bottom:70px; }
    .brand-logo { font-family:'Space Grotesk', sans-serif; font-size:36px; font-weight:900; letter-spacing:8px; text-align:center; background:linear-gradient(135deg, #fff 20%, var(--accent-glow)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 15px rgba(157,78,221,0.3)); }
    .nav-group { display:flex; flex-direction:column; gap:10px; }
    .nav-link { padding:18px 25px; border-radius:20px; color:var(--text-dim); font-weight:700; font-size:15px; text-decoration:none; display:flex; align-items:center; gap:20px; transition:var(--transition-bounce); position:relative; overflow:hidden; border:1px solid transparent; cursor:pointer; }
    .nav-link:hover { color:#fff; background:var(--glass); transform:translateX(12px); border-color:var(--glass-border); }
    .nav-link.active { background:linear-gradient(90deg, rgba(157,78,221,0.15), transparent); color:#fff; border-left:5px solid var(--accent); box-shadow:inset 15px 0 30px rgba(0,0,0,0.3); }
    .nav-link i { font-style:normal; font-size:20px; transition:0.3s; }
    .nav-link:hover i { transform:scale(1.3) rotate(-10deg); filter:drop-shadow(0 0 8px var(--accent-glow)); }
    .nav-divider { margin:20px 0; height:1px; background:var(--glass-border); }
    .viewport { margin-left:var(--sidebar-w); width:calc(100% - var(--sidebar-w)); padding:40px 50px; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow-y:auto; overflow-x:hidden; position:relative; }
    .view-title { font-size:clamp(60px,8vw,140px); font-weight:900; letter-spacing:-6px; line-height:0.85; margin-bottom:30px; background:linear-gradient(to bottom, #fff 40%, #444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .search-box { width:100%; background:rgba(255,255,255,0.02); border:1px solid var(--glass-border); padding:18px 28px; border-radius:20px; color:#fff; font-size:16px; margin-bottom:30px; outline:none; }
    .search-box:focus { border-color:var(--accent); }
    .label-wrap { display:flex; align-items:center; gap:20px; margin-bottom:30px; }
    .section-label { font-size:13px; text-transform:uppercase; letter-spacing:5px; color:var(--text-mute); font-weight:800; }
    .line-dec { flex:1; height:1px; background:var(--glass-border); }
    .friends-list { display:flex; flex-direction:column; gap:12px; }
    .friend-row { display:flex; align-items:center; gap:20px; background:var(--bg-card); border:1px solid var(--glass-border); padding:20px; border-radius:var(--radius-md); transition:0.3s; }
    .friend-row:hover { border-color:var(--accent-glow); background:rgba(157,78,221,0.05); }
    .friend-avatar { width:50px; height:50px; border-radius:50%; background:var(--glass); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
    .friend-info { flex:1; }
    .friend-nick { font-weight:700; font-size:16px; }
    .friend-status { font-size:13px; color:var(--text-dim); margin-top:2px; }
    .btn { padding:10px 20px; border:none; border-radius:12px; font-weight:700; cursor:pointer; font-size:13px; transition:0.3s; }
    .btn-accent { background:var(--accent); color:#fff; }
    .btn-accent:hover { background:var(--accent-glow); }
    .btn-danger { background:transparent; border:1px solid var(--danger); color:var(--danger); }
    .btn-danger:hover { background:rgba(255,0,85,0.1); }
    .btn-outline { background:transparent; border:1px solid var(--glass-border); color:var(--text-dim); }
    .btn-outline:hover { border-color:var(--accent); color:#fff; }
    .toast { position:fixed; top:30px; right:30px; background:#12121c; border:1px solid #2a2a35; padding:18px 28px; border-radius:18px; color:#fff; z-index:1000; animation:slideIn 0.4s ease; }
    @keyframes slideIn { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="brand-box"><div class="brand-logo">BROX</div></div>
  <nav class="nav-group">
    <a href="home.html" class="nav-link"><i>🏠</i> Home</a>
    <a href="home.html" class="nav-link"><i>🧭</i> Discovery</a>
    <a href="home.html" class="nav-link"><i>🛒</i> Avatar Shop</a>
    <a href="home.html" class="nav-link"><i>👤</i> Avatar</a>
    <div class="nav-divider"></div>
    <a href="friends.html" class="nav-link active"><i>🍋‍🟩</i> Friends</a>
    <a href="home.html" class="nav-link"><i>🎒</i> Inventory</a>
    <a href="home.html" class="nav-link"><i>✉️</i> Messages</a>
    <a href="settings.html" class="nav-link"><i>⚙️</i> Settings</a>
    <a href="broxs.html" class="nav-link"><i>🧪</i> Brox Studio</a>
    <a href="prime.html" class="nav-link"><i>👑</i> Prime</a>
  </nav>
</aside>

<main class="viewport">
  <div class="view-title">Friends</div>

  <input type="text" class="search-box" id="friendSearch" placeholder="🔍 Найти друга по нику...">

  <div class="label-wrap">
    <span class="section-label" id="friendsCount">Друзья (0)</span>
    <div class="line-dec"></div>
  </div>

  <div class="friends-list" id="friendsList"></div>

  <div class="label-wrap" style="margin-top:50px;">
    <span class="section-label">Запросы в друзья</span>
    <div class="line-dec"></div>
  </div>

  <div class="friends-list" id="requestsList"></div>
</main>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
    authDomain: "spark-9e768.firebaseapp.com",
    databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "spark-9e768",
    storageBucket: "spark-9e768.firebasestorage.app",
    messagingSenderId: "660066059407",
    appId: "1:660066059407:web:0d87f09259e53563555cfa"
  });

  const db = firebase.database();
  const currentUser = localStorage.getItem('spark_user') || 'demo';

  function pushToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  // ЗАГРУЗКА ДРУЗЕЙ
  function loadFriends() {
    db.ref(`users/${currentUser}/friends`).on('value', async snap => {
      const friends = snap.exists() ? Object.keys(snap.val()) : [];
      document.getElementById('friendsCount').textContent = `Друзья (${friends.length})`;
      const list = document.getElementById('friendsList');

      if (!friends.length) {
        list.innerHTML = '<div style="color:var(--text-dim);padding:20px;">Пока нет друзей</div>';
        return;
      }

      list.innerHTML = '';
      for (const f of friends) {
        const userSnap = await db.ref(`users/${f}`).once('value');
        const d = userSnap.exists() ? userSnap.val() : {};
        const online = d.online === true;

        const row = document.createElement('div');
        row.className = 'friend-row';
        row.innerHTML = `
          <div class="friend-avatar">${d.emoji || '😎'}</div>
          <div class="friend-info">
            <div class="friend-nick">${f}</div>
            <div class="friend-status">${online ? '🟢 Онлайн' : '⚫ Офлайн'}</div>
          </div>
          <button class="btn btn-outline" onclick="viewProfile('${f}')">Профиль</button>
          <button class="btn btn-danger" onclick="removeFriend('${f}')">Удалить</button>
        `;
        list.appendChild(row);
      }
    });
  }

  // ЗАГРУЗКА ЗАПРОСОВ
  function loadRequests() {
    db.ref(`users/${currentUser}/friendRequests`).on('value', async snap => {
      const requests = snap.exists() ? Object.keys(snap.val()) : [];
      const list = document.getElementById('requestsList');

      if (!requests.length) {
        list.innerHTML = '<div style="color:var(--text-dim);padding:20px;">Нет входящих запросов</div>';
        return;
      }

      list.innerHTML = '';
      for (const r of requests) {
        const userSnap = await db.ref(`users/${r}`).once('value');
        const d = userSnap.exists() ? userSnap.val() : {};

        const row = document.createElement('div');
        row.className = 'friend-row';
        row.innerHTML = `
          <div class="friend-avatar">${d.emoji || '😎'}</div>
          <div class="friend-info">
            <div class="friend-nick">${r}</div>
            <div class="friend-status">Хочет добавить вас в друзья</div>
          </div>
          <button class="btn btn-accent" onclick="acceptRequest('${r}')">Принять</button>
          <button class="btn btn-danger" onclick="declineRequest('${r}')">Отклонить</button>
        `;
        list.appendChild(row);
      }
    });
  }

  // ПОИСК ДРУГА
  document.getElementById('friendSearch').addEventListener('input', function() {
    const query = this.value.trim().toLowerCase();
    if (!query) { loadFriends(); return; }

    db.ref('users').once('value', snap => {
      const users = snap.val() || {};
      const found = Object.entries(users).find(([name]) => name !== currentUser && name.toLowerCase().includes(query));
      const list = document.getElementById('friendsList');

      if (!found) {
        list.innerHTML = '<div style="color:var(--text-dim);padding:20px;">Игрок не найден</div>';
        return;
      }

      const [name, data] = found;
      list.innerHTML = `
        <div class="friend-row">
          <div class="friend-avatar">${data.emoji || '😎'}</div>
          <div class="friend-info">
            <div class="friend-nick">${name}</div>
            <div class="friend-status">${data.online ? '🟢 Онлайн' : '⚫ Офлайн'}</div>
          </div>
          <button class="btn btn-accent" onclick="sendRequest('${name}')">Добавить</button>
        </div>
      `;
    });
  });

  // ФУНКЦИИ
  window.viewProfile = (nick) => window.location.href = `user.html?nick=${nick}`;

  window.removeFriend = async (nick) => {
    await db.ref(`users/${currentUser}/friends/${nick}`).remove();
    await db.ref(`users/${nick}/friends/${currentUser}`).remove();
    pushToast(`${nick} удалён из друзей`);
  };

  window.acceptRequest = async (nick) => {
    await db.ref(`users/${currentUser}/friends/${nick}`).set(true);
    await db.ref(`users/${nick}/friends/${currentUser}`).set(true);
    await db.ref(`users/${currentUser}/friendRequests/${nick}`).remove();
    pushToast(`${nick} теперь ваш друг!`);
  };

  window.declineRequest = async (nick) => {
    await db.ref(`users/${currentUser}/friendRequests/${nick}`).remove();
    pushToast(`Запрос от ${nick} отклонён`);
  };

  window.sendRequest = async (nick) => {
    await db.ref(`users/${nick}/friendRequests/${currentUser}`).set(true);
    pushToast(`Запрос отправлен ${nick}`);
  };

  // ЗАПУСК
  loadFriends();
  loadRequests();
</script>

</body>
</html>
