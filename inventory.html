<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROX | Inventory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #030106;
            --accent: #9d4edd;
            --accent-glow: #c77dff;
            --coin: #ffcc00;
            --text: #ffffff;
            --dim: #7d7d7d;
            --glass: rgba(18, 9, 32, 0.5);
            --glass-bright: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
            --radius-lg: 28px;
            --radius-md: 18px;
            --sidebar-w: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Сайдбар */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            background: rgba(6,3,10,0.99);
            backdrop-filter: blur(60px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 40px 25px;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-box { margin-bottom: 60px; }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 6px;
            text-align: center;
            background: linear-gradient(135deg, #fff 20%, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(157,78,221,0.3));
        }

        .nav-group { display: flex; flex-direction: column; gap: 6px; }

        .nav-link {
            padding: 14px 20px;
            border-radius: 16px;
            color: var(--dim);
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .nav-link:hover {
            color: #fff;
            background: var(--glass-bright);
            border-color: var(--border);
            transform: translateX(6px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(157,78,221,0.15), transparent);
            color: #fff;
            border-left: 4px solid var(--accent);
        }

        .nav-link i { font-style: normal; font-size: 18px; }
        .nav-divider { margin: 16px 0; height: 1px; background: var(--border); }

        /* Main */
        .main {
            flex: 1;
            padding: 40px 50px;
            overflow-y: auto;
            height: 100vh;
        }

        .view-title {
            font-size: clamp(60px, 8vw, 120px);
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 0.85;
            margin-bottom: 30px;
            background: linear-gradient(to bottom, #fff 40%, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Статистика */
        .inv-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .inv-stat {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 25px;
            text-align: center;
            transition: 0.3s;
        }

        .inv-stat:hover {
            border-color: var(--accent-glow);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(157,78,221,0.15);
        }

        .inv-stat-val {
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-glow);
            font-family: 'JetBrains Mono', monospace;
        }

        .inv-stat-label {
            font-size: 12px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .label-wrap { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #333;
            font-weight: 800;
            white-space: nowrap;
        }

        .line-dec { flex: 1; height: 1px; background: var(--border); }

        /* Сетка инвентаря */
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .inv-item {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
            cursor: grab;
            transition: 0.3s;
            position: relative;
        }

        .inv-item:hover {
            background: var(--glass-bright);
            border-color: var(--accent-glow);
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .inv-item:active { cursor: grabbing; }

        .inv-item-icon {
            font-size: 42px;
            display: block;
            margin-bottom: 10px;
        }

        .inv-item-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .inv-item-qty {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            border-radius: 99px;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Редкости */
        .rarity-legendary { color: #ffcc00; text-shadow: 0 0 8px rgba(255,204,0,0.3); }
        .rarity-epic { color: #c77dff; text-shadow: 0 0 8px rgba(199,125,255,0.3); }
        .rarity-rare { color: #00bfff; text-shadow: 0 0 8px rgba(0,191,255,0.3); }
        .rarity-common { color: #888; }

        /* Достижения */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }

        .ach-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: 0.3s;
        }

        .ach-card.done { opacity: 0.5; }
        .ach-card:hover { border-color: var(--accent-glow); }

        .ach-icon { font-size: 42px; }

        .ach-info { flex: 1; }

        .ach-name { font-weight: 800; font-size: 16px; margin-bottom: 4px; }

        .ach-desc { font-size: 13px; color: var(--dim); }

        .ach-progress {
            margin-top: 8px;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .ach-progress-bar {
            height: 100%;
            background: var(--accent-glow);
            border-radius: 3px;
            transition: 0.5s;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            border: 1px solid #ff0055;
            color: #ff0055;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 30px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: rgba(255,0,85,0.1);
            transform: translateX(-4px);
        }

        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #12121c;
            border: 1px solid #2a2a35;
            padding: 18px 28px;
            border-radius: 18px;
            color: #fff;
            z-index: 1000;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand-box"><div class="brand-logo">BROX</div></div>
    <nav class="nav-group">
        <a href="home.html" class="nav-link"><i>🏠</i> Home</a>
        <a href="discovery.html" class="nav-link"><i>🧭</i> Discovery</a>
        <a href="avatars.html" class="nav-link"><i>🛒</i> Avatar Shop</a>
        <a href="avatar.html" class="nav-link"><i>👤</i> Avatar</a>
        <div class="nav-divider"></div>
        <a href="inventory.html" class="nav-link active"><i>🎒</i> Inventory</a>
        <a href="messages.html" class="nav-link"><i>✉️</i> Messages</a>
        <a href="settings.html" class="nav-link"><i>⚙️</i> Settings</a>
        <a href="broxs.html" class="nav-link"><i>🧪</i> Brox Studio</a>
    </nav>
</div>

<div class="main">
    <a href="home.html" class="btn-back">← Назад в BROX</a>

    <div class="view active" id="view-inventory">
        <div class="view-title">Inventory</div>

        <!-- Статистика -->
        <div class="inv-stats">
            <div class="inv-stat">
                <div class="inv-stat-val" id="totalItems">0</div>
                <div class="inv-stat-label">Total Items</div>
            </div>
            <div class="inv-stat">
                <div class="inv-stat-val" id="rareItems">0</div>
                <div class="inv-stat-label">Rare+</div>
            </div>
            <div class="inv-stat">
                <div class="inv-stat-val" id="legendaryItems">0</div>
                <div class="inv-stat-label">Legendary</div>
            </div>
            <div class="inv-stat">
                <div class="inv-stat-val" id="invValue">0</div>
                <div class="inv-stat-label">Total Value</div>
            </div>
        </div>

        <!-- Коллекция -->
        <div class="label-wrap">
            <span class="section-label">Коллекция</span>
            <div class="line-dec"></div>
        </div>
        <div class="inv-grid" id="invGrid"></div>

        <!-- Достижения -->
        <div class="label-wrap" style="margin-top:60px;">
            <span class="section-label">Достижения</span>
            <div class="line-dec"></div>
        </div>
        <div class="achievements-grid" id="achievementsList"></div>
    </div>
</div>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
        authDomain: "spark-9e768.firebaseapp.com",
        databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "spark-9e768",
        storageBucket: "spark-9e768.firebasestorage.app",
        messagingSenderId: "660066059407",
        appId: "1:660066059407:web:0d87f09259e53563555cfa"
    });

    const db = firebase.database();
    const currentUser = localStorage.getItem('spark_user') || 'demo';
    const invRef = db.ref(`users/${currentUser}/inventory`);
    const achRef = db.ref(`users/${currentUser}/achievements`);

    // ========== ИНВЕНТАРЬ ==========
    function loadInventory() {
        invRef.on('value', snap => {
            const items = snap.exists() ? Object.values(snap.val()) : [];

            if (items.length === 0) {
                const defaultInv = {
                    it1: { icon: '🗡️', name: 'Void Katana', qty: 1, rarity: 'legendary', value: 1200 },
                    it2: { icon: '🎭', name: 'Cyber Mask', qty: 1, rarity: 'epic', value: 450 },
                    it3: { icon: '🧥', name: 'Neon Trench', qty: 1, rarity: 'epic', value: 800 },
                    it4: { icon: '🔫', name: 'Phantom Rifle', qty: 1, rarity: 'legendary', value: 2200 },
                    it5: { icon: '🏍️', name: 'Speed Bike', qty: 1, rarity: 'epic', value: 1800 },
                    it6: { icon: '🦋', name: 'Holo Wings', qty: 1, rarity: 'legendary', value: 3500 },
                    it7: { icon: '💊', name: 'Health Pack', qty: 12, rarity: 'common', value: 50 },
                    it8: { icon: '⚡', name: 'Energy Cell', qty: 8, rarity: 'common', value: 30 },
                    it9: { icon: '🔑', name: 'Vault Key', qty: 3, rarity: 'rare', value: 200 },
                    it10: { icon: '💎', name: 'Diamond Shard', qty: 5, rarity: 'rare', value: 500 }
                };
                invRef.set(defaultInv);
                renderInventory(Object.values(defaultInv));
                return;
            }

            renderInventory(items);
        });
    }

    function renderInventory(items) {
        const grid = document.getElementById('invGrid');
        let total = 0, rare = 0, legendary = 0, totalValue = 0;

        grid.innerHTML = items.map(item => {
            total++;
            if (item.rarity === 'rare' || item.rarity === 'epic') rare++;
            if (item.rarity === 'legendary') legendary++;
            totalValue += (item.value || 0) * (item.qty || 1);

            return `
                <div class="inv-item" draggable="true" 
                     data-icon="${item.icon}" data-name="${item.name}" data-slot="misc">
                    <div class="inv-item-qty">${item.qty || 1}x</div>
                    <span class="inv-item-icon">${item.icon}</span>
                    <div class="inv-item-name rarity-${item.rarity}">${item.name}</div>
                </div>
            `;
        }).join('');

        document.getElementById('totalItems').textContent = total;
        document.getElementById('rareItems').textContent = rare;
        document.getElementById('legendaryItems').textContent = legendary;
        document.getElementById('invValue').textContent = (totalValue / 1000).toFixed(1) + 'K';

        // Drag-and-drop
        document.querySelectorAll('#invGrid .inv-item').forEach(el => {
            el.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text/plain', `${el.dataset.icon}|${el.dataset.name}|${el.dataset.slot}`);
                el.style.opacity = '0.5';
            });
            el.addEventListener('dragend', e => { el.style.opacity = '1'; });
        });
    }

    // ========== ДОСТИЖЕНИЯ ==========
    function loadAchievements() {
        achRef.on('value', snap => {
            const achievements = snap.exists() ? Object.values(snap.val()) : [];

            if (achievements.length === 0) {
                const defaultAch = {
                    a1: { id: 'first_game', name: 'Первый запуск', desc: 'Запустите любую игру', done: false },
                    a2: { id: 'spender', name: 'Большой транжира', desc: 'Потратьте 5000 BROBUX', done: false, progress: 2500, target: 5000 },
                    a3: { id: 'chatter', name: 'Общительный', desc: 'Отправьте 10 сообщений', done: false, progress: 7, target: 10 },
                    a4: { id: 'collector', name: 'Коллекционер', desc: 'Владейте 20 предметами', done: false, progress: 12, target: 20 },
                    a5: { id: 'parkour', name: 'Паркурщик', desc: 'Соберите 50 монет в 3D-игре', done: false, progress: 15, target: 50 }
                };
                achRef.set(defaultAch);
                renderAchievements(Object.values(defaultAch));
                return;
            }

            renderAchievements(achievements);
        });
    }

    function renderAchievements(achievements) {
        const container = document.getElementById('achievementsList');
        container.innerHTML = achievements.map(a => `
            <div class="ach-card ${a.done ? 'done' : ''}">
                <div class="ach-icon">${a.done ? '✅' : '🔒'}</div>
                <div class="ach-info">
                    <div class="ach-name">${a.name} ${a.done ? '✓' : ''}</div>
                    <div class="ach-desc">${a.desc}</div>
                    ${a.target ? `
                        <div class="ach-progress">
                            <div class="ach-progress-bar" style="width:${Math.min(100, ((a.progress || 0) / a.target) * 100)}%"></div>
                        </div>
                        <div style="font-size:11px; color:var(--dim); margin-top:4px;">${a.progress || 0} / ${a.target}</div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    // Запуск
    loadInventory();
    loadAchievements();
</script>

</body>
</html>
