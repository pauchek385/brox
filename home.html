<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BROX | God-Tier Universe 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    /* ========== ТВОЙ CSS (без изменений) ========== */
    :root {
      --bg-ultra: #030106;
      --bg-sidebar: rgba(6, 3, 10, 0.99);
      --bg-card: rgba(18, 9, 32, 0.5);
      --accent: #9d4edd;
      --accent-glow: #c77dff;
      --accent-deep: #3c096c;
      --coin: #ffcc00;
      --coin-glow: rgba(255, 204, 0, 0.3);
      --danger: #ff0055;
      --success: #00ff88;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.07);
      --glass-bright: rgba(255, 255, 255, 0.12);
      --sidebar-w: 320px;
      --text-main: #ffffff;
      --text-dim: #7d7d7d;
      --text-mute: #333333;
      --radius-lg: 35px;
      --radius-md: 22px;
      --transition-main: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    body, html {
      background: var(--bg-ultra); color: var(--text-main); font-family: 'Inter', sans-serif;
      width:100%!important; height:100%!important; min-height:100vh!important; max-height:100vh!important;
      overflow:hidden!important; display:flex;
    }
    ::-webkit-scrollbar { width:4px; height:4px; background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:10px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--accent); }
    #master-canvas { position:fixed; top:0; left:0; z-index:-1; width:100%; height:100%; pointer-events:none; }
    .ambient-glow { position:fixed; top:-10%; right:-10%; width:60vw; height:60vw; background:radial-gradient(circle, rgba(138,43,226,0.08) 0%, transparent 70%); z-index:-1; animation:pulse_glow 15s infinite alternate; }
    @keyframes pulse_glow { from { transform:scale(1); opacity:0.5; } to { transform:scale(1.2); opacity:0.8; } }
    .sidebar { width:var(--sidebar-w); height:100vh; background:var(--bg-sidebar); backdrop-filter:blur(60px); border-right:1px solid var(--glass-border); display:flex; flex-direction:column; padding:50px 35px; position:fixed; left:0; top:0; z-index:2000; overflow-y:auto; }
    .brand-box { margin-bottom:70px; }
    .brand-logo { font-family:'Space Grotesk', sans-serif; font-size:36px; font-weight:900; letter-spacing:8px; text-align:center; background:linear-gradient(135deg, #fff 20%, var(--accent-glow)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 15px rgba(157,78,221,0.3)); }
    .nav-group { display:flex; flex-direction:column; gap:10px; }
    .nav-link { padding:18px 25px; border-radius:20px; color:var(--text-dim); font-weight:700; font-size:15px; text-decoration:none; display:flex; align-items:center; gap:20px; transition:var(--transition-bounce); position:relative; overflow:hidden; border:1px solid transparent; cursor:pointer; }
    .nav-link:hover { color:#fff; background:var(--glass); transform:translateX(12px); border-color:var(--glass-border); }
    .nav-link.active { background:linear-gradient(90deg, rgba(157,78,221,0.15), transparent); color:#fff; border-left:5px solid var(--accent); box-shadow:inset 15px 0 30px rgba(0,0,0,0.3); }
    .nav-link i { font-style:normal; font-size:20px; transition:0.3s; }
    .nav-link:hover i { transform:scale(1.3) rotate(-10deg); filter:drop-shadow(0 0 8px var(--accent-glow)); }
    .nav-divider { margin:20px 0; height:1px; background:var(--glass-border); }
    .viewport { margin-left:var(--sidebar-w); width:calc(100% - var(--sidebar-w)); padding:40px 50px; display:flex; flex-direction:column; height:100vh; max-height:100vh; overflow-y:auto; overflow-x:hidden; position:relative; }
    .header-engine { display:flex; justify-content:space-between; align-items:center; margin-bottom:50px; gap:50px; width:100%; flex-shrink:0; }
    .search-system { flex:1; max-width:1100px; position:relative; }
    .search-input { width:100%; background:rgba(255,255,255,0.02); border:1px solid var(--glass-border); padding:22px 40px; border-radius:25px; color:#fff; font-size:16px; font-weight:500; backdrop-filter:blur(20px); transition:var(--transition-main); }
    .search-input:focus { background:rgba(255,255,255,0.04); border-color:var(--accent); box-shadow:0 0 50px rgba(157,78,221,0.15); transform:translateY(-2px); }
    .search-input::placeholder { color:var(--text-mute); }
    .status-cluster { display:flex; align-items:center; gap:30px; }
    .wallet-engine { background:rgba(255,204,0,0.04); border:1px solid rgba(255,204,0,0.15); padding:15px 30px; border-radius:50px; display:flex; align-items:center; gap:15px; cursor:pointer; transition:var(--transition-bounce); }
    .wallet-engine:hover { transform:scale(1.05) rotate(-1deg); background:rgba(255,204,0,0.08); box-shadow:0 0 30px var(--coin-glow); }
    .coin-orb { width:20px; height:20px; background:var(--coin); border-radius:50%; box-shadow:0 0 15px var(--coin); display:flex; align-items:center; justify-content:center; color:#000; font-size:11px; font-weight:900; }
    .wallet-balance { font-weight:900; color:var(--coin); font-family:'JetBrains Mono'; }
    .icon-btn { font-size:28px; cursor:pointer; color:var(--text-mute); transition:var(--transition-main); }
    .icon-btn:hover { color:#fff; transform:rotate(15deg) scale(1.2); }
    .view { width:100%; animation:view_in 0.5s cubic-bezier(0.19,1,0.22,1) forwards; }
    @keyframes view_in { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .view-title { font-size:clamp(60px,8vw,140px); font-weight:900; letter-spacing:-6px; line-height:0.85; margin-bottom:30px; background:linear-gradient(to bottom, #fff 40%, #444); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .label-wrap { display:flex; align-items:center; gap:20px; margin-bottom:40px; }
    .section-label { font-size:13px; text-transform:uppercase; letter-spacing:5px; color:var(--text-mute); font-weight:800; }
    .line-dec { flex:1; height:1px; background:var(--glass-border); }
    .friends-row { display:flex; gap:30px; padding:10px 0 30px; overflow-x:auto; overflow-y:hidden; flex-wrap:nowrap; align-items:center; width:100%; }
    .friend-card { display:flex; flex-direction:column; align-items:center; gap:12px; cursor:pointer; position:relative; flex-shrink:0; width:95px; text-align:center; }
    .friend-card * { pointer-events:none; }
    .avatar-wrap { width:85px; height:85px; background:var(--glass); border:2px solid var(--glass-border); border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; font-size:32px; will-change:transform,border-color; transition:transform 0.3s cubic-bezier(0.25,1,0.5,1),border-color 0.2s ease,background-color 0.2s ease; }
    .friend-card:hover .avatar-wrap { transform:translate3d(0,-6px,0) scale(1.05); border-color:var(--accent-glow); background-color:rgba(18,9,32,0.8); box-shadow:0 15px 30px rgba(157,78,221,0.25); }
    .status-light { position:absolute; bottom:3px; right:3px; width:16px; height:16px; background:var(--success); border-radius:50%; border:3px solid var(--bg-ultra); box-shadow:0 0 10px var(--success); }
    .status-light.away { background:var(--coin); box-shadow:0 0 10px var(--coin); }
    .status-light.offline { background:var(--text-mute); box-shadow:none; }
    .friend-name { font-size:13px; font-weight:700; color:var(--text-dim); transition:color 0.2s ease,transform 0.3s ease; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; width:100%; }
    .friend-card:hover .friend-name { color:#fff; transform:translateY(-2px); }
    .add-friend .avatar-wrap { background:var(--glass-bright); border:2px dashed var(--glass-border); }
    .add-friend:hover .avatar-wrap { border-color:var(--accent-glow); background:rgba(157,78,221,0.05); }
    .scroll-container { position:relative; width:100%; }
    .scroll-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(18,9,32,0.8); border:1px solid var(--glass-border); color:var(--text-dim); width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; z-index:10; transition:0.3s; display:flex; align-items:center; justify-content:center; }
    .scroll-btn:hover { color:#fff; background:var(--accent); border-color:var(--accent); }
    .scroll-btn.left { left:-22px; }
    .scroll-btn.right { right:-22px; }
    .game-grid { display:flex; gap:40px; padding:10px 0 40px; width:100%; overflow-x:auto; overflow-y:visible; }
    .game-grid::-webkit-scrollbar { height:4px; background:transparent; }
    .game-grid::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:10px; }
    .game-tile { min-width:480px; height:270px; background:var(--bg-card); border:1px solid var(--glass-border); border-radius:var(--radius-lg); position:relative; overflow:hidden; cursor:pointer; transition:var(--transition-main); flex-shrink:0; z-index:1; }
    .game-tile:hover { transform:translateY(-10px); border-color:var(--accent); box-shadow:0 30px 70px rgba(0,0,0,0.8); z-index:10; }
    .game-art { position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(0.5) saturate(1.1); transition:1.2s cubic-bezier(0.19,1,0.22,1); }
    .game-tile:hover .game-art { transform:scale(1.1) rotate(0.5deg); filter:brightness(0.7); }
    .game-content { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 70%); padding:45px; display:flex; flex-direction:column; justify-content:flex-end; z-index:5; }
    .play-icon { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%) scale(0); width:80px; height:80px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; color:#fff; box-shadow:0 0 50px var(--accent); transition:var(--transition-bounce); z-index:20; }
    .game-tile:hover .play-icon { transform:translate(-50%,-50%) scale(1); }
    .game-title { font-size:30px; font-weight:900; margin-bottom:8px; }
    .game-meta { display:flex; gap:20px; font-size:14px; color:var(--text-dim); }
    .tag { display:inline-block; padding:5px 14px; border-radius:99px; font-size:12px; font-weight:700; letter-spacing:1px; }
    .tag-hot { background:rgba(255,0,85,0.15); color:var(--danger); border:1px solid rgba(255,0,85,0.3); }
    .tag-new { background:rgba(0,255,136,0.1); color:var(--success); border:1px solid rgba(0,255,136,0.2); }
    .tag-live { background:rgba(157,78,221,0.15); color:var(--accent-glow); border:1px solid rgba(157,78,221,0.3); animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .toast-container { position:fixed; top:40px; right:40px; display:flex; flex-direction:column; gap:15px; z-index:10000; }
    .toast { background:var(--bg-sidebar); border:1px solid var(--glass-bright); padding:22px 35px; border-radius:22px; color:#fff; display:flex; align-items:center; gap:20px; box-shadow:0 30px 60px rgba(0,0,0,0.8); animation:toast_slide 0.6s cubic-bezier(0.175,0.885,0.32,1.275); transition:0.5s; }
    @keyframes toast_slide { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    .toast.dismiss { transform:translateX(150%); opacity:0; }
    .toast-icon { width:12px; height:12px; border-radius:50%; background:var(--accent-glow); }
    .footer { margin-top:auto; padding:80px 0 40px; border-top:1px solid var(--glass-border); display:flex; justify-content:space-between; color:var(--text-mute); font-size:13px; font-weight:700; }
    .img-u1 { background-image:url('https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=1200'); }
    .img-u2 { background-image:url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200'); }
    .img-u3 { background-image:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200'); }
    .img-u4 { background-image:url('https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=1200'); }
    .img-u5 { background-image:url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200'); }
    .img-u6 { background-image:url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=1200'); }
  </style>
</head>
<body>
  <canvas id="master-canvas"></canvas>
  <div class="ambient-glow"></div>
  <div class="toast-container" id="toaster"></div>

  <aside class="sidebar">
    <div class="brand-box"><div class="brand-logo">BROX</div></div>
    <nav class="nav-group">
      <a class="nav-link active" data-view="home" onclick="loadView('home')"><i>🏠</i> Home</a>
      <a class="nav-link" data-view="discovery" onclick="loadView('discovery')"><i>🧭</i> Discovery</a>
      <a class="nav-link" data-view="market" onclick="loadView('market')"><i>🛒</i> Avatar Shop</a>
      <a class="nav-link" data-view="shop" onclick="loadView('shop')"><i>👤</i> Avatar</a>
      <div class="nav-divider"></div>
      <a class="nav-link" data-view="inventory" onclick="loadView('inventory')"><i>🎒</i> Inventory</a>
      <a class="nav-link" data-view="messages" onclick="loadView('messages')"><i>✉️</i> Messages</a>
      <a class="nav-link" data-view="settings" onclick="loadView('settings')"><i>⚙️</i> Settings</a>
      <a class="nav-link" data-view="sandbox" onclick="loadView('sandbox')"><i>🧪</i> Sandbox</a>
      <a class="nav-link" data-view="prime" onclick="loadView('prime')"><i>👑</i> Prime</a>
    </nav>
  </aside>

  <main class="viewport">
    <header class="header-engine">
      <div class="search-system"><input type="text" class="search-input" placeholder="Поиск миров, игр, создателей..." id="globalSearch"></div>
      <div class="status-cluster">
        <div class="wallet-engine" id="walletTrigger"><div class="coin-orb">B</div><span class="wallet-balance" id="balanceDisplay">0 BROBUX</span></div>
        <div class="icon-btn" id="logoutBtn" title="Выйти" style="font-size:28px;">🚪</div>
      </div>
    </header>

    <div id="view-container"></div>
  </main>

  <script>
    // ========== Firebase ==========
    firebase.initializeApp({
      apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
      authDomain: "spark-9e768.firebaseapp.com",
      databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "spark-9e768",
      storageBucket: "spark-9e768.firebasestorage.app",
      messagingSenderId: "660066059407",
      appId: "1:660066059407:web:0d87f09259e53563555cfa"
    });
    const db = firebase.database();

    // ========== Аутентификация ==========
    const currentUser = localStorage.getItem('spark_user');
    if (!currentUser) window.location.href = '/';

    // ========== Реальный баланс из brobux (как в игре УДАЧА) ==========
    const balanceRef = db.ref(`users/${currentUser}/brobux`);
    balanceRef.on('value', snap => {
      const brobux = snap.exists() ? snap.val() : 0;
      document.getElementById('balanceDisplay').textContent = `${brobux.toLocaleString()} BROBUX`;
    });

    // ========== Онлайн-статус ==========
    db.ref(`users/${currentUser}/online`).set(true);
    window.addEventListener('beforeunload', () => {
      db.ref(`users/${currentUser}/online`).set(false);
    });

    // ========== Выход ==========
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await db.ref(`users/${currentUser}/online`).set(false);
      localStorage.removeItem('spark_user');
      window.location.href = '/';
    });

    // ========== Тост ==========
    function pushToast(msg, color) {
      const t = document.createElement('div'); t.className = 'toast';
      t.innerHTML = `<div class="toast-icon" style="background:${color||'var(--accent-glow)'}"></div><span>${msg}</span>`;
      document.getElementById('toaster').appendChild(t);
      setTimeout(() => { t.classList.add('dismiss'); setTimeout(() => t.remove(), 500); }, 4000);
    }

    // ========== Рендер Home ==========
    function renderHome() {
      const container = document.getElementById('view-container');
      container.innerHTML = `
        <div class="view active" id="view-home">
          <div class="view-title">Home</div>
          <div class="label-wrap"><span class="section-label" id="friends-count">Друзья (0)</span><div class="line-dec"></div></div>
          <div class="friends-row" id="realtime-friends">
            <div class="friend-card add-friend" onclick="window.location.href='/friends'">
              <div class="avatar-wrap">➕</div><span class="friend-name">Add Friend</span>
            </div>
          </div>
          <div class="label-wrap"><span class="section-label">Продолжить</span><div class="line-dec"></div></div>
          <div class="scroll-container">
            <button class="scroll-btn left" onclick="document.getElementById('homeGames').scrollBy({left:-520,behavior:'smooth'})">❮</button>
            <button class="scroll-btn right" onclick="document.getElementById('homeGames').scrollBy({left:520,behavior:'smooth'})">❯</button>
            <div class="game-grid" id="homeGames"></div>
          </div>
          <footer class="footer"><div>© 2026 BROX INTERACTIVE. NEXT-GEN ENGINE.</div><div style="display:flex;gap:40px;"><span>API</span><span>TERMS</span><span>PRIVACY</span></div></footer>
        </div>
      `;
      listenToFriends();
      renderRealGames();
    }

    // ========== Друзья из Firebase ==========
    function listenToFriends() {
      const row = document.getElementById('realtime-friends');
      if (!row) return;

      db.ref(`users/${currentUser}/friends`).on('value', async snap => {
        const friendsObj = snap.exists() ? snap.val() : {};
        const friendNicks = Object.keys(friendsObj);

        document.getElementById('friends-count').textContent = `Друзья (${friendNicks.length})`;

        row.innerHTML = `
          <div class="friend-card add-friend" onclick="window.location.href='/friends'">
            <div class="avatar-wrap">➕</div><span class="friend-name">Add Friend</span>
          </div>
        `;

        if (friendNicks.length === 0) {
          const empty = document.createElement('div');
          empty.style.cssText = 'color:var(--text-dim); font-size:14px; padding:20px;';
          empty.textContent = 'Пока нет друзей';
          row.appendChild(empty);
          return;
        }

        for (const friendNick of friendNicks) {
          const userSnap = await db.ref(`users/${friendNick}`).once('value');
          const userData = userSnap.exists() ? userSnap.val() : {};
          const emoji = userData.emoji || '😎';
          const online = userData.online === true;
          const status = online ? 'online' : (userData.status === 'afk' ? 'away' : 'offline');

          const card = document.createElement('div');
          card.className = 'friend-card';
          card.innerHTML = `
            <div class="avatar-wrap">
              ${emoji}
              <div class="status-light ${status}"></div>
            </div>
            <span class="friend-name">${friendNick}</span>
          `;
          row.appendChild(card);
        }
      });
    }

    // ========== Реальные игры ==========
    function renderRealGames() {
      const grid = document.getElementById('homeGames');
      if (!grid) return;

      const games = [
        {
          id: 'flappy',
          title: '🐦 Flappy Bird',
          thumb: 'img-u1',
          players: 12400,
          rating: 4.8,
          url: '/game-flappy'
        },
        {
          id: 'casino',
          title: '🎰 УДАЧА',
          thumb: 'img-u2',
          players: 8900,
          rating: 4.6,
          url: '/game-casino'
        }
      ];

      grid.innerHTML = games.map(g => `
        <div class="game-tile" data-url="${g.url}">
          <div class="game-art ${g.thumb}"></div>
          <div class="play-icon">▶</div>
          <div class="game-content">
            <div class="game-title">${g.title}</div>
            <div class="game-meta"><span>🟢 ${g.players.toLocaleString()}</span><span>⭐ ${g.rating}</span></div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.game-tile').forEach(tile => {
        tile.addEventListener('click', function(e) {
          const url = this.dataset.url;
          if (url) window.location.href = url;
          else pushToast('Игра скоро появится', 'var(--accent-glow)');
        });
      });
    }

    function loadView(viewName) {
      const container = document.getElementById('view-container');
      if (viewName === 'home') {
        renderHome();
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.querySelector('.nav-link[data-view="home"]').classList.add('active');
        return;
      }
      container.innerHTML = `<div class="view active"><div class="view-title">${viewName}</div><p>Раздел в разработке</p></div>`;
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      const activeLink = document.querySelector(`.nav-link[data-view="${viewName}"]`);
      if (activeLink) activeLink.classList.add('active');
    }

    window.addEventListener('load', () => {
      renderHome();
    });
  </script>
</body>
</html>
