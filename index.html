<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BROX | Вход и Регистрация</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-ultra: #030106;
      --accent: #9d4edd;
      --accent-glow: #c77dff;
      --coin: #ffcc00;
      --danger: #ff0055;
      --success: #00ff88;
      --glass: rgba(18, 9, 32, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-dim: #7d7d7d;
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    body {
      background: var(--bg-ultra);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Фон */
    body::before {
      content: '';
      position: fixed;
      top: -10%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(138,43,226,0.1) 0%, transparent 70%);
      z-index: -1;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
      padding: 20px;
    }

    .auth-card {
      background: var(--glass);
      backdrop-filter: blur(40px);
      border: 1px solid var(--border);
      border-radius: 35px;
      padding: 50px 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      animation: float 0.6s cubic-bezier(0.19,1,0.22,1);
    }

    @keyframes float {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 8px;
      text-align: center;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #fff 20%, var(--accent-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(157,78,221,0.3));
    }

    .subtitle {
      text-align: center;
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 40px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .input-field {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      transition: 0.3s;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(157,78,221,0.15);
    }

    .auth-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      border: none;
      border-radius: 16px;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 25px;
      font-family: 'Inter', sans-serif;
    }

    .auth-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(157,78,221,0.3);
    }

    .auth-btn:active { transform: scale(0.98); }

    .toggle-mode {
      text-align: center;
      margin-top: 25px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .toggle-link {
      color: var(--accent-glow);
      cursor: pointer;
      font-weight: 700;
      transition: 0.3s;
    }

    .toggle-link:hover { color: #fff; }

    .error-message {
      background: rgba(255,0,85,0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message {
      background: rgba(0,255,136,0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 30px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .google-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: 0.3s;
      font-family: 'Inter', sans-serif;
    }

    .google-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: var(--accent);
    }

    @media (max-width: 500px) {
      .auth-card { padding: 40px 25px; }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo">BROX</div>
    <div class="subtitle" id="subtitle">Добро пожаловать в новую эру</div>

    <div class="error-message" id="error-message"></div>
    <div class="success-message" id="success-message"></div>

    <!-- Форма -->
    <form id="auth-form">
      <div class="input-group" id="username-group" style="display:none;">
        <div class="input-label">НИКНЕЙМ</div>
        <input type="text" class="input-field" id="username" placeholder="Твой ник">
      </div>

      <div class="input-group">
        <div class="input-label">EMAIL</div>
        <input type="email" class="input-field" id="email" placeholder="brox@example.com" required>
      </div>

      <div class="input-group">
        <div class="input-label">ПАРОЛЬ</div>
        <input type="password" class="input-field" id="password" placeholder="Минимум 6 символов" minlength="6" required>
      </div>

      <button type="submit" class="auth-btn" id="submit-btn">ВОЙТИ</button>
    </form>

    <div class="toggle-mode">
      <span id="toggle-text">Нет аккаунта?</span>
      <span class="toggle-link" id="toggle-link" onclick="toggleMode()">Создать</span>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">или</div>
      <div class="divider-line"></div>
    </div>

    <button class="google-btn" onclick="googleSignIn()">
      <span style="font-size:20px;">🔵</span> Войти через Google
    </button>
  </div>
</div>

<script>
  // Firebase конфигурация
  firebase.initializeApp({
    apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
    authDomain: "spark-9e768.firebaseapp.com",
    databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "spark-9e768",
    storageBucket: "spark-9e768.firebasestorage.app",
    messagingSenderId: "660066059407",
    appId: "1:660066059407:web:0d87f09259e53563555cfa"
  });

  const auth = firebase.auth();
  const db   = firebase.database();

  // Режим (вход / регистрация)
  let isLogin = true;
  const form        = document.getElementById('auth-form');
  const submitBtn   = document.getElementById('submit-btn');
  const subtitle    = document.getElementById('subtitle');
  const toggleText  = document.getElementById('toggle-text');
  const toggleLink  = document.getElementById('toggle-link');
  const usernameGrp = document.getElementById('username-group');
  const errorMsg    = document.getElementById('error-message');
  const successMsg  = document.getElementById('success-message');

  function toggleMode() {
    isLogin = !isLogin;
    if (isLogin) {
      usernameGrp.style.display = 'none';
      submitBtn.textContent = 'ВОЙТИ';
      subtitle.textContent = 'Добро пожаловать в новую эру';
      toggleText.textContent = 'Нет аккаунта?';
      toggleLink.textContent = 'Создать';
    } else {
      usernameGrp.style.display = 'block';
      submitBtn.textContent = 'ЗАРЕГИСТРИРОВАТЬСЯ';
      subtitle.textContent = 'Создай свой аккаунт BROX';
      toggleText.textContent = 'Уже есть аккаунт?';
      toggleLink.textContent = 'Войти';
    }
    hideMessages();
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    successMsg.style.display = 'none';
  }

  function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.style.display = 'block';
    errorMsg.style.display = 'none';
  }

  function hideMessages() {
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
  }

  // Сохранение пользователя в Realtime DB
  async function saveUserToDB(user, username) {
    const userData = {
      email: user.email,
      username: username || user.displayName || 'Игрок',
      balance: 1350,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    };
    await db.ref('users/' + user.uid).set(userData);
  }

  // Отправка формы
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const username = document.getElementById('username').value.trim();

    if (password.length < 6) {
      showError('Пароль должен быть не менее 6 символов');
      return;
    }

    try {
      if (isLogin) {
        // Вход
        await auth.signInWithEmailAndPassword(email, password);
        showSuccess('Вход выполнен! Переадресация...');
      } else {
        // Регистрация
        if (!username) {
          showError('Придумай никнейм');
          return;
        }
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        await saveUserToDB(userCred.user, username);
        showSuccess('Аккаунт создан! Добро пожаловать в BROX');
      }

      // Перенаправление на главную
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 1500);
    } catch (err) {
      console.error(err);
      if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
        showError('Неверный email или пароль');
      } else if (err.code === 'auth/email-already-in-use') {
        showError('Этот email уже используется');
      } else {
        showError('Ошибка: ' + err.message);
      }
    }
  });

  // Google Sign‑In
  async function googleSignIn() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      const result = await auth.signInWithPopup(provider);
      const user = result.user;

      // Проверим, есть ли уже такой пользователь в базе
      const snap = await db.ref('users/' + user.uid).once('value');
      if (!snap.exists()) {
        await saveUserToDB(user, user.displayName || 'Игрок');
      }
      showSuccess('Вход через Google выполнен!');
      setTimeout(() => { window.location.href = 'home.html'; }, 1500);
    } catch (err) {
      console.error(err);
      showError('Ошибка входа через Google');
    }
  }
  window.googleSignIn = googleSignIn;
</script>
</body>
</html>
