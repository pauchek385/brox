<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>spark — реакция</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .reaction-screen {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.1s;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .reaction-screen.waiting { background: #2a2a2a; cursor: not-allowed; }
    .reaction-screen.ready { background: #3a6a2a; cursor: pointer; animation: pulse 0.5s infinite; }
    .reaction-screen.false-start { background: #6a2a2a; }
    .reaction-screen.hit { background: #2a6a3a; }
    .reaction-screen.finished { background: #1a1a1a; cursor: default; }
    .reaction-time { font-size: 4rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    @keyframes pulse {
      0%, 100% { background: #3a6a2a; }
      50% { background: #4a8a3a; }
    }
  </style>
</head>
<body>
<div class="game-container" style="max-width:500px;margin:0 auto;padding:20px;">
  <div id="gameContent"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, get, update, onValue, set, runTransaction } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { startOnlineHeartbeat } from './app.js';

const firebaseConfig = {
  apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
  authDomain: "spark-9e768.firebaseapp.com",
  databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spark-9e768",
  storageBucket: "spark-9e768.firebasestorage.app",
  messagingSenderId: "660066059407",
  appId: "1:660066059407:web:0d87f09259e53563555cfa"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nick = localStorage.getItem('spark_user');
if (!nick) window.location.href = '/';

startOnlineHeartbeat(nick);

const urlParams = new URLSearchParams(window.location.search);
const duelId = urlParams.get('id');
if (!duelId) window.location.href = '/lobby';

const duelRef = ref(db, `duels/${duelId}`);
const myRef = ref(db, `users/${nick}`);

let mySide = null;
let opponentNick = null;
let gameInterval = null;
let statsUpdated = false;
let hasClicked = false;

async function init() {
  const snap = await get(duelRef);
  const duel = snap.val();
  if (!duel || duel.status !== 'accepted') {
    document.getElementById('gameContent').innerHTML = '<p>Дуэль не найдена</p>';
    return;
  }

  if (duel.from === nick) { mySide = 'from'; opponentNick = duel.to; }
  else if (duel.to === nick) { mySide = 'to'; opponentNick = duel.from; }

  // Инициализируем игру
  if (!duel.gameState) {
    await update(duelRef, {
      gameState: 'waiting',
      fromReady: false,
      toReady: false,
      fromTime: null,
      toTime: null,
      winner: null,
      winnerTime: null
    });
  }

  await update(duelRef, { [mySide + 'Ready']: true });

  onValue(duelRef, (snap) => {
    const data = snap.val();
    if (!data) { window.location.href = '/lobby'; return; }
    renderGame(data);
  });
}

function renderGame(data) {
  const bothReady = data.fromReady && data.toReady;
  const winner = data.winner;
  
  // Если есть победитель - показываем результат
  if (winner) {
    renderResult(winner, data);
    return;
  }
  
  // Ожидание готовности противника
  if (!bothReady) {
    document.getElementById('gameContent').innerHTML = `
      <div class="reaction-screen waiting">
        <div style="font-size:3rem;">⏳</div>
        <h2>ожидание противника</h2>
        <p style="color:var(--muted);">${opponentNick} ещё не готов...</p>
      </div>
    `;
    return;
  }
  
  // Игра началась - ждём стартовый сигнал
  if (!data.startTime) {
    // Только хост (from) запускает игру
    if (mySide === 'from' && !gameInterval) {
      const randomDelay = 1500 + Math.random() * 2500;
      document.getElementById('gameContent').innerHTML = `
        <div class="reaction-screen waiting">
          <div style="font-size:3rem;">🎯</div>
          <h2>приготовься...</h2>
          <p style="color:var(--muted);">зелёный экран появится через ${Math.round(randomDelay/1000)}-${Math.round((randomDelay+1000)/1000)} сек</p>
        </div>
      `;
      setTimeout(async () => {
        await update(duelRef, { startTime: Date.now(), gameState: 'active' });
      }, randomDelay);
    } else {
      document.getElementById('gameContent').innerHTML = `
        <div class="reaction-screen waiting">
          <div style="font-size:3rem;">🎯</div>
          <h2>приготовься...</h2>
          <p style="color:var(--muted);">жди зелёный экран</p>
        </div>
      `;
    }
    return;
  }
  
  // Активная игра - можно кликать (только если ещё нет победителя)
  if (data.gameState === 'active' && !data.winner && !hasClicked) {
    document.getElementById('gameContent').innerHTML = `
      <div class="reaction-screen ready" id="reactionBtn">
        <div style="font-size:4rem;">⚡</div>
        <h2>КЛИКАЙ!</h2>
        <p style="color:rgba(255,255,255,0.7);">кто первый нажмёт — тот победил!</p>
      </div>
    `;
    
    const btn = document.getElementById('reactionBtn');
    if (btn && !btn.hasListener) {
      btn.hasListener = true;
      btn.addEventListener('click', async () => {
        if (hasClicked) return; // Уже кликнули
        hasClicked = true;
        
        const reactionTime = Date.now() - data.startTime;
        
        // Проверяем, не определился ли уже победитель
        const currentSnap = await get(duelRef);
        const currentData = currentSnap.val();
        
        if (currentData.winner) {
          // Уже есть победитель - игрок опоздал
          showLoserScreen(reactionTime);
          return;
        }
        
        // Записываем победителя
        await update(duelRef, { 
          winner: nick,
          winnerTime: reactionTime,
          [mySide + 'Time']: reactionTime,
          gameState: 'finished'
        });
      });
    }
    return;
  }
}

async function showLoserScreen(myTime) {
  const snap = await get(duelRef);
  const data = snap.val();
  const winnerTime = data.winnerTime;
  const winnerNick = data.winner;
  
  document.getElementById('gameContent').innerHTML = `
    <div class="reaction-screen finished" style="background:#3a2a2a;">
      <div style="font-size:3rem;">😭</div>
      <h2 style="color:#f87171;">ТЫ ОПОЗДАЛ!</h2>
      <p style="color:var(--muted); margin:20px 0;">
        ${winnerNick} кликнул за ${winnerTime} мс<br>
        твой клик: ${myTime} мс
      </p>
      <p style="color:#facc15;">${winnerTime + 50 > myTime ? '🔫 чуть-чуть не хватило!' : '🏃‍♂️ он просто быстрее'}</p>
      <button class="btn mt-2" onclick="window.location.href='/lobby'">в лобби</button>
    </div>
  `;
}

async function renderResult(winner, data) {
  const isWinner = winner === nick;
  const myTime = mySide === 'from' ? data.fromTime : data.toTime;
  const winnerTime = data.winnerTime;
  
  // Обновляем статистику (только один раз)
  if (!statsUpdated && mySide === 'from' && !data.statsProcessed) {
    statsUpdated = true;
    await update(duelRef, { statsProcessed: true });
    
    const winnerNick = winner;
    const loserNick = winner === data.from ? data.to : data.from;
    
    // Обновляем победителя
    const winnerRef = ref(db, `users/${winnerNick}`);
    const winnerSnap = await get(winnerRef);
    const winnerData = winnerSnap.val() || {};
    await update(winnerRef, {
      wins: (winnerData.wins || 0) + 1,
      rating: (winnerData.rating || 1000) + 25
    });
    
    // Обновляем проигравшего
    const loserRef = ref(db, `users/${loserNick}`);
    const loserSnap = await get(loserRef);
    const loserData = loserSnap.val() || {};
    await update(loserRef, {
      losses: (loserData.losses || 0) + 1,
      rating: Math.max(0, (loserData.rating || 1000) - 25)
    });
  }
  
  document.getElementById('gameContent').innerHTML = `
    <div style="text-align:center; margin-top:40px;">
      <div class="game-result ${isWinner ? 'result-win' : 'result-lose'}">
        ${isWinner ? 'ТЫ ПОБЕДИЛ! 🏆' : 'ТЫ ПРОИГРАЛ 💀'}
      </div>
      <p style="color:var(--muted); margin:20px 0;">
        ${isWinner ? 'твоя реакция: ' + winnerTime + ' мс' : 'реакция победителя: ' + winnerTime + ' мс'}<br>
        ${isWinner ? `ты опередил ${opponentNick}! ⚡` : `${winner} оказался быстрее`}
      </p>
      <button class="btn" onclick="window.location.href='/lobby'">в лобби</button>
      <button class="btn ghost mt-2" onclick="window.location.reload()">🔄 реванш</button>
    </div>
  `;
  setTimeout(() => { set(duelRef, null); }, 60000);
}

init();
</script>
</body>
</html>
