<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BROX | Discovery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-ultra: #030106;
      --bg-sidebar: rgba(6, 3, 10, 0.99);
      --bg-card: rgba(18, 9, 32, 0.5);
      --accent: #9d4edd;
      --accent-glow: #c77dff;
      --accent-deep: #3c096c;
      --coin: #ffcc00;
      --coin-glow: rgba(255, 204, 0, 0.3);
      --danger: #ff0055;
      --success: #00ff88;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.07);
      --glass-bright: rgba(255, 255, 255, 0.12);
      --sidebar-w: 320px;
      --text-main: #ffffff;
      --text-dim: #7d7d7d;
      --text-mute: #333333;
      --radius-lg: 35px;
      --radius-md: 22px;
      --transition-main: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    body, html {
      background: var(--bg-ultra); color: var(--text-main); font-family: 'Inter', sans-serif;
      width:100%!important; height:100%!important; overflow:hidden!important; display:flex;
    }
    ::-webkit-scrollbar { width:4px; height:4px; background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:10px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--accent); }

    .sidebar {
      width:var(--sidebar-w); height:100vh; background:var(--bg-sidebar);
      backdrop-filter:blur(60px); border-right:1px solid var(--glass-border);
      display:flex; flex-direction:column; padding:50px 35px; position:fixed;
      left:0; top:0; z-index:2000; overflow-y:auto;
    }
    .brand-box { margin-bottom:70px; }
    .brand-logo {
      font-family:'Space Grotesk', sans-serif; font-size:36px; font-weight:900;
      letter-spacing:8px; text-align:center;
      background:linear-gradient(135deg, #fff 20%, var(--accent-glow));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 15px rgba(157,78,221,0.3));
    }
    .nav-group { display:flex; flex-direction:column; gap:10px; }
    .nav-link {
      padding:18px 25px; border-radius:20px; color:var(--text-dim);
      font-weight:700; font-size:15px; text-decoration:none; display:flex;
      align-items:center; gap:20px; transition:var(--transition-bounce);
      position:relative; overflow:hidden; border:1px solid transparent; cursor:pointer;
    }
    .nav-link:hover { color:#fff; background:var(--glass); transform:translateX(12px); border-color:var(--glass-border); }
    .nav-link.active { background:linear-gradient(90deg, rgba(157,78,221,0.15), transparent); color:#fff; border-left:5px solid var(--accent); }
    .nav-link i { font-style:normal; font-size:20px; }
    .nav-divider { margin:20px 0; height:1px; background:var(--glass-border); }

    .viewport {
      margin-left:var(--sidebar-w); width:calc(100% - var(--sidebar-w));
      padding:40px 50px; display:flex; flex-direction:column;
      height:100vh; max-height:100vh; overflow-y:auto; overflow-x:hidden;
    }

    .view-title {
      font-size:clamp(60px,8vw,140px); font-weight:900; letter-spacing:-6px;
      line-height:0.85; margin-bottom:30px;
      background:linear-gradient(to bottom, #fff 40%, #444);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .label-wrap { display:flex; align-items:center; gap:20px; margin-bottom:30px; }
    .section-label { font-size:13px; text-transform:uppercase; letter-spacing:5px; color:var(--text-mute); font-weight:800; }
    .line-dec { flex:1; height:1px; background:var(--glass-border); }

    .category-tabs { display:flex; gap:12px; margin-bottom:40px; flex-wrap:wrap; }
    .tab-btn {
      padding:12px 24px; border-radius:99px; border:1px solid var(--glass-border);
      background:transparent; color:var(--text-dim); font-size:14px;
      font-weight:700; cursor:pointer; transition:var(--transition-bounce);
    }
    .tab-btn:hover { color:#fff; border-color:var(--glass-bright); }
    .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); box-shadow:0 0 30px rgba(157,78,221,0.4); }

    .scroll-container { position:relative; }
    .scroll-btn {
      position:absolute; top:50%; transform:translateY(-50%);
      background:rgba(18,9,32,0.8); border:1px solid var(--glass-border);
      color:var(--text-dim); width:44px; height:44px; border-radius:50%;
      font-size:20px; cursor:pointer; z-index:10; transition:0.3s;
      display:flex; align-items:center; justify-content:center;
    }
    .scroll-btn:hover { color:#fff; background:var(--accent); border-color:var(--accent); }
    .scroll-btn.left { left:-22px; }
    .scroll-btn.right { right:-22px; }

    .discovery-grid {
      display:flex; gap:30px; overflow-x:auto; overflow-y:visible;
      padding:10px 0 30px;
    }
    .discovery-grid::-webkit-scrollbar { height:4px; background:transparent; }
    .discovery-grid::-webkit-scrollbar-thumb { background:var(--glass-border); border-radius:10px; }

    .discovery-card {
      min-width:300px; background:var(--bg-card); border:1px solid var(--glass-border);
      border-radius:var(--radius-md); overflow:hidden; cursor:pointer;
      transition:var(--transition-main); flex-shrink:0; z-index:1;
    }
    .discovery-card:hover { transform:translateY(-10px); border-color:var(--accent); z-index:10; }
    .disc-thumb {
      height:160px; background-size:cover; background-position:center; position:relative;
    }
    .disc-thumb::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.8));
    }
    .disc-body { padding:25px; }
    .disc-category {
      font-size:11px; text-transform:uppercase; letter-spacing:3px;
      color:var(--accent-glow); font-weight:800; margin-bottom:8px;
    }
    .disc-title { font-size:20px; font-weight:800; margin-bottom:10px; }
    .disc-desc { font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:20px; }
    .disc-footer { display:flex; justify-content:space-between; align-items:center; }
    .disc-players { font-size:13px; color:var(--text-mute); font-family:'JetBrains Mono'; }
    .disc-rating { font-size:13px; color:var(--coin); font-weight:700; }

    .mini-discovery-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
      gap:20px; width:100%;
    }
    .mini-card {
      background:var(--bg-card); border:1px solid var(--glass-border);
      border-radius:18px; overflow:hidden; cursor:pointer;
      transition:var(--transition-main); text-align:center;
    }
    .mini-card:hover { transform:translateY(-8px); border-color:var(--accent); }
    .mini-thumb { height:90px; background-size:cover; background-position:center; }
    .mini-body { padding:12px; }
    .mini-title { font-size:14px; font-weight:700; margin-bottom:4px; }
    .mini-meta { font-size:11px; color:var(--text-dim); }

    .img-u1 { background-image:url('https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?q=80&w=1200'); }
    .img-u2 { background-image:url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200'); }
    .img-u3 { background-image:url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200'); }
    .img-u4 { background-image:url('https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=1200'); }
    .img-u5 { background-image:url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200'); }
    .img-u6 { background-image:url('https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=1200'); }

    .toast-container { position:fixed; top:40px; right:40px; display:flex; flex-direction:column; gap:15px; z-index:10000; }
    .toast {
      background:var(--bg-sidebar); border:1px solid var(--glass-bright);
      padding:22px 35px; border-radius:22px; color:#fff; display:flex;
      align-items:center; gap:20px; box-shadow:0 30px 60px rgba(0,0,0,0.8);
      animation:toast_slide 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    @keyframes toast_slide { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    .toast.dismiss { transform:translateX(150%); opacity:0; }
    .toast-icon { width:12px; height:12px; border-radius:50%; background:var(--accent-glow); }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="brand-box"><div class="brand-logo">BROX</div></div>
  <nav class="nav-group">
    <a class="nav-link" href="home.html"><i>🏠</i> Home</a>
    <a class="nav-link active" href="discovery.html"><i>🧭</i> Discovery</a>
    <a class="nav-link" href="market.html"><i>🛒</i> Avatar Shop</a>
    <a class="nav-link" href="shop.html"><i>👤</i> Avatar</a>
    <div class="nav-divider"></div>
    <a class="nav-link" href="inventory.html"><i>🎒</i> Inventory</a>
    <a class="nav-link" href="messages.html"><i>✉️</i> Messages</a>
    <a class="nav-link" href="settings.html"><i>⚙️</i> Settings</a>
    <a class="nav-link" href="sandbox.html"><i>🧪</i> Sandbox</a>
    <a class="nav-link" href="prime.html"><i>👑</i> Prime</a>
  </nav>
</aside>

<main class="viewport">
  <div class="view active" id="view-discovery">
    <div class="view-title">Discover</div>

    <!-- Категории -->
    <div class="category-tabs" id="discTabs">
      <button class="tab-btn active" data-cat="all">All</button>
      <button class="tab-btn" data-cat="racing">Racing</button>
      <button class="tab-btn" data-cat="rpg">RPG</button>
      <button class="tab-btn" data-cat="action">Action</button>
      <button class="tab-btn" data-cat="survival">Survival</button>
      <button class="tab-btn" data-cat="social">Social</button>
    </div>

    <!-- Рекомендации (горизонтальный скролл) -->
    <div class="label-wrap">
      <span class="section-label">Рекомендации</span>
      <div class="line-dec"></div>
    </div>
    <div class="scroll-container">
      <button class="scroll-btn left" onclick="document.getElementById('discGrid').scrollBy({left:-330,behavior:'smooth'})">❮</button>
      <button class="scroll-btn right" onclick="document.getElementById('discGrid').scrollBy({left:330,behavior:'smooth'})">❯</button>
      <div class="discovery-grid" id="discGrid"></div>
    </div>

    <!-- Все игры (сетка) -->
    <div class="label-wrap" style="margin-top:40px;">
      <span class="section-label">Все игры</span>
      <div class="line-dec"></div>
    </div>
    <div class="mini-discovery-grid" id="miniDiscGrid"></div>
  </div>
</main>

<div class="toast-container" id="toaster"></div>

<script>
  // ========== FIREBASE ==========
  firebase.initializeApp({
    apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
    authDomain: "spark-9e768.firebaseapp.com",
    databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "spark-9e768",
    storageBucket: "spark-9e768.firebasestorage.app",
    messagingSenderId: "660066059407",
    appId: "1:660066059407:web:0d87f09259e53563555cfa"
  });
  const db = firebase.database();

  // ========== ТОСТЫ ==========
  function pushToast(msg, color = 'var(--accent-glow)') {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<div class="toast-icon" style="background:${color}"></div><span>${msg}</span>`;
    document.getElementById('toaster').appendChild(t);
    setTimeout(() => { t.classList.add('dismiss'); setTimeout(() => t.remove(), 500); }, 4000);
  }

  // ========== ЗАГРУЗКА ИГР ==========
  function loadDiscovery(category = 'all') {
    const gamesRef = db.ref('games');
    
    gamesRef.once('value', snap => {
      const allGames = snap.exists() ? Object.values(snap.val()) : [];
      const filtered = category === 'all' ? allGames : allGames.filter(g => g.cat === category);

      // Рекомендации (первые 6)
      const recGrid = document.getElementById('discGrid');
      const recommended = filtered.slice(0, 6);
      recGrid.innerHTML = recommended.map(g => `
        <div class="discovery-card" onclick="pushToast('Запуск ${g.title}...')">
          <div class="disc-thumb ${g.thumb || 'img-u1'}"></div>
          <div class="disc-body">
            <div class="disc-category">${g.cat || 'game'}</div>
            <div class="disc-title">${g.title}</div>
            <div class="disc-desc">${g.desc || 'Описание скоро появится'}</div>
            <div class="disc-footer">
              <div class="disc-players">🟢 ${(g.players || 0).toLocaleString()}</div>
              <div class="disc-rating">⭐ ${g.rating || 0}</div>
            </div>
          </div>
        </div>
      `).join('') || '<div style="color:var(--text-dim); padding:20px;">Нет игр в этой категории</div>';

      // Сетка мини-карточек
      const miniGrid = document.getElementById('miniDiscGrid');
      miniGrid.innerHTML = filtered.map(g => `
        <div class="mini-card" onclick="pushToast('Запуск ${g.title}...')">
          <div class="mini-thumb ${g.thumb || 'img-u1'}"></div>
          <div class="mini-body">
            <div class="mini-title">${g.title}</div>
            <div class="mini-meta">⭐ ${g.rating || 0} · ${(g.players || 0).toLocaleString()}</div>
          </div>
        </div>
      `).join('') || '<div style="color:var(--text-dim); padding:20px; grid-column:1/-1;">Нет игр</div>';
    });
  }

  // ========== ПЕРЕКЛЮЧЕНИЕ КАТЕГОРИЙ ==========
  document.getElementById('discTabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('#discTabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadDiscovery(btn.dataset.cat);
  });

  // ========== СТАРТ ==========
  loadDiscovery();
</script>

</body>
</html>
