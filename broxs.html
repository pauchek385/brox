<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BROX | Brox Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #030106;
      --accent: #9d4edd;
      --text: #fff;
      --dim: #7d7d7d;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
      display: flex; height: 100vh; overflow: hidden;
    }
    .sidebar {
      width: 260px; background: rgba(6,3,10,0.99); border-right: 1px solid rgba(255,255,255,0.07);
      padding: 30px 20px; display: flex; flex-direction: column; gap: 15px;
    }
    .logo { 
      font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 900; 
      color: #c77dff; text-align: center; margin-bottom: 10px; 
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700;
      cursor: pointer; font-size: 14px; transition: 0.3s; font-family: 'Inter', sans-serif;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #c77dff; }
    .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: #aaa; }
    .btn-outline:hover { border-color: var(--accent); color: #fff; }
    .btn-publish { background: #00ff88; color: #000; }
    .btn-publish:hover { background: #00cc66; }
    .btn-back { background: transparent; color: #ff0055; border: 1px solid #ff0055; margin-top: auto; }
    .btn-back:hover { background: rgba(255,0,85,0.1); }

    .main {
      flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden;
    }
    .editor-header {
      display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-shrink: 0;
    }
    .game-title-input {
      flex: 1; padding: 14px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
      color: #fff; font-size: 18px; font-weight: 700; outline: none;
    }
    .game-title-input:focus { border-color: var(--accent); }

    .editor-workspace {
      flex: 1; display: flex; gap: 20px; min-height: 0;
    }
    .game-preview {
      flex: 2; background: #0a0a14; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .game-preview iframe {
      width: 100%; height: 100%; border: none;
    }
    .empty-state {
      color: var(--dim); font-size: 48px; text-align: center;
    }
    .empty-state span {
      display: block; font-size: 14px; margin-top: 10px;
    }
    .tools-panel {
      flex: 1; background: rgba(6,3,10,0.8); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column;
    }
    .tools-title {
      font-size: 14px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 3px; color: var(--dim); margin-bottom: 20px;
    }
    .tool-group { margin-bottom: 24px; }
    .tool-label { font-size: 12px; color: #888; margin-bottom: 8px; font-weight: 600; display: block; }
    .code-editor {
      width: 100%; background: #0a0a14; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px; color: #00ff88; font-family: 'Courier New', monospace;
      font-size: 13px; padding: 14px; outline: none; resize: vertical;
    }
    .code-editor:focus { border-color: var(--accent); }

    /* Модальное окно */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #13131c; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px; padding: 30px; width: 90%; max-width: 500px;
    }
    .modal h3 { margin-bottom: 20px; font-size: 20px; }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 12px; margin: 8px 0; background: #1a1a2e;
      border: 1px solid #333; border-radius: 10px; color: #fff; font-family: 'Inter', sans-serif;
    }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .success-msg {
      color: #00ff88; text-align: center; padding: 20px; display: none;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">🧪 Brox Studio</div>
  
  <button class="btn btn-outline" onclick="newGame()">📄 Новый проект</button>
  <button class="btn btn-outline" onclick="loadTemplate('platformer')">🕹️ Шаблон: Платформер</button>
  <button class="btn btn-outline" onclick="loadTemplate('clicker')">👆 Шаблон: Кликер</button>
  
  <button class="btn btn-publish" onclick="openPublishModal()">🚀 Опубликовать игру</button>
  <button class="btn btn-back" onclick="window.location.href='home.html'">← Назад в BROX</button>
</div>

<div class="main">
  <div class="editor-header">
    <input type="text" class="game-title-input" id="gameTitle" placeholder="Название игры..." value="Моя игра">
  </div>

  <div class="editor-workspace">
    <div class="game-preview" id="gamePreview">
      <div class="empty-state">🎮<span>Код игры появится здесь</span></div>
    </div>

    <div class="tools-panel">
      <div class="tools-title">🛠️ Редактор кода</div>
      
      <div class="tool-group">
        <label class="tool-label">HTML</label>
        <textarea class="code-editor" id="htmlCode" rows="6" placeholder="<div id='game'>...</div>"></textarea>
      </div>
      
      <div class="tool-group">
        <label class="tool-label">CSS</label>
        <textarea class="code-editor" id="cssCode" rows="6" placeholder="#game { ... }"></textarea>
      </div>
      
      <div class="tool-group">
        <label class="tool-label">JavaScript</label>
        <textarea class="code-editor" id="jsCode" rows="8" placeholder="// Логика игры..."></textarea>
      </div>
      
      <button class="btn btn-primary" onclick="updatePreview()">▶️ Запустить предпросмотр</button>
    </div>
  </div>
</div>

<!-- Модалка публикации -->
<div class="modal-overlay" id="publishModal">
  <div class="modal">
    <h3>🚀 Опубликовать игру</h3>
    <div id="publishForm">
      <input type="text" id="pubTitle" placeholder="Название игры">
      <textarea id="pubDesc" placeholder="Описание игры" rows="3"></textarea>
      <select id="pubCat">
        <option value="action">Action</option>
        <option value="rpg">RPG</option>
        <option value="racing">Racing</option>
        <option value="social">Social</option>
        <option value="survival">Survival</option>
      </select>
      <div class="modal-buttons">
        <button class="btn btn-outline" onclick="closePublishModal()">Отмена</button>
        <button class="btn btn-publish" onclick="publishGame()">Опубликовать</button>
      </div>
    </div>
    <div class="success-msg" id="successMsg">
      ✅ Игра опубликована!<br><br>
      <a href="home.html" style="color:#c77dff;">Вернуться в BROX</a>
    </div>
  </div>
</div>

<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
    authDomain: "spark-9e768.firebaseapp.com",
    databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "spark-9e768",
    storageBucket: "spark-9e768.firebasestorage.app",
    messagingSenderId: "660066059407",
    appId: "1:660066059407:web:0d87f09259e53563555cfa"
  });
  const db = firebase.database();

  // ========== ШАБЛОНЫ ИГР ==========
  const templates = {
    platformer: {
      html: '<canvas id="gameCanvas" width="400" height="300"></canvas>',
      css: '#gameCanvas { background: #87CEEB; display: block; margin: 0 auto; border: 2px solid #333; }',
      js: `const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let player = { x: 50, y: 200, w: 30, h: 30, vy: 0, onGround: false };
let platforms = [
  { x: 0, y: 280, w: 400, h: 20 },
  { x: 150, y: 200, w: 100, h: 10 }
];

function gameLoop() {
  player.vy += 0.5;
  player.y += player.vy;
  
  player.onGround = false;
  platforms.forEach(p => {
    if (player.x < p.x + p.w && player.x + player.w > p.x &&
        player.y + player.h > p.y && player.y < p.y + p.h && player.vy > 0) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  });
  
  ctx.clearRect(0, 0, 400, 300);
  ctx.fillStyle = '#ff6600';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  
  ctx.fillStyle = '#654321';
  platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));
  
  requestAnimationFrame(gameLoop);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') player.x += 20;
  if (e.key === 'ArrowLeft') player.x -= 20;
  if (e.key === ' ' && player.onGround) player.vy = -10;
});

gameLoop();`
    },
    clicker: {
      html: `<div style="text-align:center; padding:50px;">
  <h2>Кликай быстрее!</h2>
  <button id="clickBtn" style="font-size:48px; padding:20px; border-radius:50%; cursor:pointer; border:none; background:#9d4edd; transition:0.1s;">🖱️</button>
  <h3>Счёт: <span id="score">0</span></h3>
</div>`,
      css: `#clickBtn:active { transform: scale(0.9); }`,
      js: `let score = 0;
document.getElementById('clickBtn').addEventListener('click', () => {
  score++;
  document.getElementById('score').textContent = score;
});`
    }
  };

  function loadTemplate(type) {
    const t = templates[type];
    if (!t) return;
    document.getElementById('htmlCode').value = t.html;
    document.getElementById('cssCode').value = t.css;
    document.getElementById('jsCode').value = t.js;
    updatePreview();
  }

  function newGame() {
    document.getElementById('htmlCode').value = '';
    document.getElementById('cssCode').value = '';
    document.getElementById('jsCode').value = '';
    document.getElementById('gameTitle').value = 'Моя игра';
    document.getElementById('gamePreview').innerHTML = '<div class="empty-state">🎮<span>Код игры появится здесь</span></div>';
  }

  function updatePreview() {
    const html = document.getElementById('htmlCode').value || '';
    const css = document.getElementById('cssCode').value || '';
    const js = document.getElementById('jsCode').value || '';

    const fullCode = `<!DOCTYPE html><html><head><style>body{margin:0;overflow:hidden;}${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
    
    const preview = document.getElementById('gamePreview');
    preview.innerHTML = '<iframe id="previewFrame" sandbox="allow-scripts allow-same-origin" style="width:100%;height:100%;border:none;"></iframe>';
    
    const frame = document.getElementById('previewFrame');
    if (frame) {
      frame.srcdoc = fullCode;
    }
  }

  function openPublishModal() {
    document.getElementById('publishModal').classList.add('show');
    document.getElementById('pubTitle').value = document.getElementById('gameTitle').value;
    document.getElementById('pubDesc').value = '';
    document.getElementById('successMsg').style.display = 'none';
    document.getElementById('publishForm').style.display = 'block';
  }

  function closePublishModal() {
    document.getElementById('publishModal').classList.remove('show');
  }

  async function publishGame() {
    const title = document.getElementById('pubTitle').value.trim();
    const desc = document.getElementById('pubDesc').value.trim();
    const cat = document.getElementById('pubCat').value;

    if (!title) {
      alert('Введи название игры!');
      return;
    }

    // Сохраняем код игры в localStorage
    const gameCode = {
      html: document.getElementById('htmlCode').value,
      css: document.getElementById('cssCode').value,
      js: document.getElementById('jsCode').value
    };
    
    try {
      localStorage.setItem('game_' + title, JSON.stringify(gameCode));
    } catch(e) {
      console.log('localStorage переполнен, но игра всё равно опубликуется');
    }

    // Добавляем игру в Firebase
    const gameRef = db.ref('games').push();
    await gameRef.set({
      title: title,
      desc: desc,
      cat: cat,
      url: '/play?game=' + gameRef.key,
      creator: localStorage.getItem('spark_user') || 'anonymous',
      verified: false,
      active: true,
      players: 0,
      rating: 0,
      createdAt: Date.now()
    });

    document.getElementById('publishForm').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    
    // Закрываем модалку через 2 секунды
    setTimeout(() => {
      closePublishModal();
    }, 2000);
  }

  // Закрытие модалки по клику вне
  document.getElementById('publishModal').addEventListener('click', function(e) {
    if (e.target === this) closePublishModal();
  });

  // Автозагрузка последнего кода
  window.addEventListener('load', () => {
    try {
      const lastCode = localStorage.getItem('lastGameCode');
      if (lastCode) {
        const code = JSON.parse(lastCode);
        document.getElementById('htmlCode').value = code.html || '';
        document.getElementById('cssCode').value = code.css || '';
        document.getElementById('jsCode').value = code.js || '';
        updatePreview();
      }
    } catch(e) {}
  });

  // Сохранение кода при уходе
  window.addEventListener('beforeunload', () => {
    const code = {
      html: document.getElementById('htmlCode').value,
      css: document.getElementById('cssCode').value,
      js: document.getElementById('jsCode').value
    };
    try {
      localStorage.setItem('lastGameCode', JSON.stringify(code));
    } catch(e) {}
  });
</script>

</body>
</html>
