<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>spark — админка</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .premium-report {
      background: linear-gradient(135deg, #1a1a1a, #1a1500);
      border-left: 3px solid #facc15;
      position: relative;
      overflow: hidden;
    }
    .premium-report::before {
      content: "👑";
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: 20px;
      opacity: 0.3;
    }
    .premium-badge-small {
      display: inline-block;
      background: linear-gradient(135deg, #facc15, #ff8c00);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.6rem;
      font-weight: 700;
      color: #0b0b0b;
      margin-left: 8px;
    }
    .premium-glow {
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
    }
    .btn-premium {
      background: linear-gradient(135deg, #facc15, #ff8c00);
      color: #0b0b0b;
      border: none;
    }
    .btn-premium:hover {
      filter: brightness(1.05);
      transform: scale(1.02);
    }
    .premium-active-badge {
      background: linear-gradient(135deg, #facc15, #ff8c00);
      color: #0b0b0b;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 700;
      display: inline-block;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: #131313;
      border: 1px solid #facc15;
      border-radius: 24px;
      padding: 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .modal-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 20px;
      text-align: center;
    }
    .modal-card input, .modal-card select {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      color: #e4e4e4;
      font-size: 0.95rem;
      margin-bottom: 16px;
      font-family: inherit;
    }
    .modal-card input:focus {
      border-color: #facc15;
      outline: none;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .modal-confirm {
      background: linear-gradient(135deg, #facc15, #ff8c00);
      color: #0b0b0b;
    }
    .modal-cancel {
      background: #2a2a2a;
      color: #aaa;
    }
    .modal-error {
      color: #f87171;
      font-size: 0.75rem;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<div class="layout">
  
  <div class="sidebar">
    <div class="sidebar-logo">spark</div>
    <a href="/profile" class="sidebar-item">
      <span class="sidebar-icon">😎</span>
      <span>профиль</span>
    </a>
    <a href="/friends" class="sidebar-item">
      <span class="sidebar-icon">🍋‍🟩</span>
      <span>друзья</span>
    </a>
    <a href="/lobby" class="sidebar-item">
      <span class="sidebar-icon">⚔️</span>
      <span>лобби</span>
    </a>
    <div class="sidebar-divider"></div>
    <a href="/reports" class="sidebar-item">
      <span class="sidebar-icon">🚩</span>
      <span>репорты</span>
    </a>
    <a href="/shop" class="sidebar-item">
      <span class="sidebar-icon">👑</span>
      <span>PSS</span>
    </a>
    <a href="/admin" class="sidebar-item active">
      <span class="sidebar-icon">🛡️</span>
      <span>админка</span>
    </a>
    
    <button class="sidebar-item" id="logoutBtn" style="color:#f87171;">
      <span class="sidebar-icon">🚪</span>
      <span>выйти</span>
    </button>
  </div>

  <div class="main">
    <div class="profile-content" style="max-width:700px;">
      
      <div id="adminContent">
        <div style="text-align:center;color:var(--muted);padding:40px;font-size:0.85rem;">загрузка...</div>
      </div>

    </div>
  </div>

</div>

<div id="toast" class="toast" style="display:none;"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, get, set, update, onValue, remove, runTransaction } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { startOnlineHeartbeat, checkUserOnlineStatus } from './app.js';

const firebaseConfig = {
  apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
  authDomain: "spark-9e768.firebaseapp.com",
  databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spark-9e768",
  storageBucket: "spark-9e768.firebasestorage.app",
  messagingSenderId: "660066059407",
  appId: "1:660066059407:web:0d87f09259e53563555cfa"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nick = localStorage.getItem('spark_user');
if (!nick) window.location.href = '/';

const myRef = ref(db, `users/${nick}`);
const adminContent = document.getElementById('adminContent');

startOnlineHeartbeat(nick);

let myRole = null;
let currentSection = 'users';
let statsUnsubscribe = null;

// ========== ПРОВЕРКА ДОСТУПА ==========
async function checkAccess() {
  const snap = await get(myRef);
  const data = snap.val();
  myRole = data?.role || null;
  
  if (myRole === 'owner' || myRole === 'admin' || myRole === 'junior') {
    renderAdmin();
  } else {
    adminContent.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">⛔ нет доступа</div>';
  }
}

function roleLabel(role) {
  switch(role) {
    case 'owner': return 'владелец';
    case 'admin': return 'админ';
    case 'junior': return 'младший админ';
    default: return 'игрок';
  }
}

// ========== ПАРСИНГ ВРЕМЕНИ ПРЕМИУМА ==========
function parsePremiumDuration(durationStr) {
  const match = durationStr.match(/^(\d+)([wm])$/i);
  if (!match) return null;
  
  const value = parseInt(match[1]);
  const unit = match[2].toLowerCase();
  
  if (value < 1 || value > 12) return null;
  
  let days = 0;
  if (unit === 'w') days = value * 7;
  if (unit === 'm') days = value * 30;
  
  return { days, value, unit };
}

// ========== МОДАЛЬНОЕ ОКНО ВЫДАЧИ ПРЕМИУМА ==========
function showPremiumModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-card">
      <h3>👑 ВЫДАТЬ ПРЕМИУМ</h3>
      <input type="text" id="premiumNick" placeholder="Ник игрока" autocomplete="off">
      <input type="text" id="premiumDuration" placeholder="Длительность (1w, 2w, 12w, 1m, 12m...)" autocomplete="off">
      <div class="modal-error" id="modalError"></div>
      <div class="modal-buttons">
        <button class="modal-cancel" id="modalCancel">отмена</button>
        <button class="modal-confirm" id="modalConfirm">выдать</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  const closeModal = () => modal.remove();
  
  modal.querySelector('#modalCancel').addEventListener('click', closeModal);
  modal.querySelector('#modalConfirm').addEventListener('click', async () => {
    const targetNick = modal.querySelector('#premiumNick').value.trim().toLowerCase();
    const durationStr = modal.querySelector('#premiumDuration').value.trim();
    const errorEl = modal.querySelector('#modalError');
    
    errorEl.textContent = '';
    
    if (!targetNick) {
      errorEl.textContent = 'введи ник игрока';
      return;
    }
    if (!durationStr) {
      errorEl.textContent = 'введи длительность (пример: 2w или 3m)';
      return;
    }
    
    const duration = parsePremiumDuration(durationStr);
    if (!duration) {
      errorEl.textContent = 'неверный формат. используй 1w — 12w или 1m — 12m';
      return;
    }
    
    const userSnap = await get(ref(db, `users/${targetNick}`));
    if (!userSnap.exists()) {
      errorEl.textContent = 'игрок не найден';
      return;
    }
    
    const now = Date.now();
    const expireAt = now + (duration.days * 24 * 60 * 60 * 1000);
    
    await update(ref(db, `users/${targetNick}`), {
      premium: true,
      premiumExpireAt: expireAt,
      premiumGrantedBy: nick,
      premiumGrantedAt: now,
      premiumDuration: durationStr
    });
    
    showToast(`👑 Премиум выдан ${targetNick} на ${duration.value}${duration.unit === 'w' ? ' недель' : ' месяцев'}`);
    closeModal();
    
    if (currentSection === 'users') {
      const usersContainer = document.getElementById('sectionContent');
      if (usersContainer) await renderUsers(usersContainer);
    }
  });
}

// ========== МОДАЛЬНОЕ ОКНО ВЫДАЧИ SC ==========
function showSCModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-card">
      <h3>💰 ВЫДАТЬ SPARK COINS</h3>
      <input type="text" id="scNick" placeholder="Ник игрока" autocomplete="off">
      <input type="number" id="scAmount" placeholder="Сумма SC" min="1" step="1" autocomplete="off">
      <div class="modal-error" id="scModalError"></div>
      <div class="modal-buttons">
        <button class="modal-cancel" id="scModalCancel">отмена</button>
        <button class="modal-confirm" id="scModalConfirm">выдать</button>
      </div>
    </div>
  `;
  
  document.body.appendChild(modal);
  
  const closeModal = () => modal.remove();
  
  modal.querySelector('#scModalCancel').addEventListener('click', closeModal);
  modal.querySelector('#scModalConfirm').addEventListener('click', async () => {
    const targetNick = modal.querySelector('#scNick').value.trim().toLowerCase();
    const amountStr = modal.querySelector('#scAmount').value.trim();
    const errorEl = modal.querySelector('#scModalError');
    
    errorEl.textContent = '';
    
    if (!targetNick) {
      errorEl.textContent = 'введи ник игрока';
      return;
    }
    
    const amount = parseInt(amountStr);
    if (isNaN(amount) || amount <= 0) {
      errorEl.textContent = 'введи корректную сумму (целое число > 0)';
      return;
    }
    
    const userSnap = await get(ref(db, `users/${targetNick}`));
    if (!userSnap.exists()) {
      errorEl.textContent = 'игрок не найден';
      return;
    }
    
    // Безопасная транзакция пополнения баланса
    await runTransaction(ref(db, `users/${targetNick}`), (data) => {
      if (data) {
        data.sparkCoins = (data.sparkCoins || 0) + amount;
      }
      return data;
    });
    
    showToast(`💰 Выдано ${amount} SC игроку ${targetNick}`);
    closeModal();
    
    if (currentSection === 'users') {
      const usersContainer = document.getElementById('sectionContent');
      if (usersContainer) await renderUsers(usersContainer);
    }
  });
}

// ========== РАЗДЕЛ "ФУНКЦИИ" ==========
async function renderFunctions(container) {
  const canGrantPremium = (myRole === 'admin' || myRole === 'owner');
  const canGrantSC = (myRole === 'admin' || myRole === 'owner'); // те же права, что и на премиум
  
  container.innerHTML = `
    <div class="admin-section-title">🔧 ФУНКЦИИ АДМИНИСТРАТОРА</div>
    
    <div class="friend-item" style="margin-bottom:16px; background:#161616;">
      <div class="friend-info">
        <div class="friend-nick">👑 ВЫДАЧА ПРЕМИУМ СТАТУСА</div>
        <div class="friend-status">выдача премиум доступа игрокам на определённый срок</div>
      </div>
      ${canGrantPremium ? `
        <button class="btn-premium" id="grantPremiumBtn" style="padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;">
          👑 выдать премиум
        </button>
      ` : `
        <span style="color:#f87171;font-size:0.7rem;">🔒 доступ только у админов</span>
      `}
    </div>
    
    <div class="friend-item" style="margin-bottom:16px; background:#161616;">
      <div class="friend-info">
        <div class="friend-nick">💰 ВЫДАЧА SPARK COINS</div>
        <div class="friend-status">пополнение баланса SC указанному игроку</div>
      </div>
      ${canGrantSC ? `
        <button class="btn-premium" id="grantSCBtn" style="padding:10px 20px;border-radius:12px;font-weight:700;cursor:pointer;">
          💰 выдать SC
        </button>
      ` : `
        <span style="color:#f87171;font-size:0.7rem;">🔒 доступ только у админов</span>
      `}
    </div>
    
    <div class="friend-item" style="background:#161616;">
      <div class="friend-info">
        <div class="friend-nick">📊 ИНФОРМАЦИЯ</div>
        <div class="friend-status">выдача премиума и SC доступна администраторам и владельцу</div>
      </div>
    </div>
  `;
  
  if (canGrantPremium) {
    const grantBtn = document.getElementById('grantPremiumBtn');
    if (grantBtn) {
      grantBtn.addEventListener('click', showPremiumModal);
    }
  }
  
  if (canGrantSC) {
    const grantSCBtn = document.getElementById('grantSCBtn');
    if (grantSCBtn) {
      grantSCBtn.addEventListener('click', showSCModal);
    }
  }
}

// ========== ПОЛЬЗОВАТЕЛИ (без кнопки выдачи) ==========
async function renderUsers(container) {
  container.innerHTML = '<div style="color:var(--muted);">загрузка...</div>';
  const usersSnap = await get(ref(db, 'users'));
  const users = usersSnap.val() || {};
  const arr = Object.entries(users).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  
  container.innerHTML = `
    <div class="admin-section-title">👥 все пользователи (${arr.length})</div>
    <table class="admin-table">
      <thead><tr><th>ник</th><th>роль</th><th>премиум</th><th>рейтинг</th><th>статус</th></tr></thead>
      <tbody>
        ${arr.map(([name, data]) => {
          const isPremium = data.premium === true;
          let premiumUntil = '';
          if (isPremium && data.premiumExpireAt) {
            const expireDate = new Date(data.premiumExpireAt);
            premiumUntil = `<div style="font-size:0.6rem;color:#facc15;">до ${expireDate.toLocaleDateString()}</div>`;
          }
          return `
          <tr>
            <td><span style="font-size:1.1rem;">${data.emoji || '😎'}</span> <strong>${name}</strong>${premiumUntil}</td>
            <td><span class="admin-badge ${data.role || 'user'}">${roleLabel(data.role)}</span></td>
            <td>${isPremium ? '<span class="premium-active-badge">👑 АКТИВЕН</span>' : '<span style="color:#555;">—</span>'}</td>
            <td>${data.rating || 1000}</td>
            <td>${data.online ? '🟢 онлайн' : '⚫ офлайн'}</td>
          </tr>
        `}).join('')}
      </tbody>
    </table>
  `;
}

// ========== РЕПОРТЫ С ПОДСВЕТКОЙ ПРЕМИУМ ==========
async function renderReports(container) {
  container.innerHTML = '<div style="color:var(--muted);">загрузка...</div>';
  
  const reportsSnap = await get(ref(db, 'reports'));
  const reports = reportsSnap.val() || {};
  const usersSnap = await get(ref(db, 'users'));
  const users = usersSnap.val() || {};
  
  const arr = Object.entries(reports).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
  
  const statuses = ['unread', 'pending', 'accepted', 'declined'];
  const statusLabels = { unread: '🚨 не прочитано', pending: '⏳ на рассмотрении', accepted: '✅ принято', declined: '❌ отказано' };

  let html = '';
  for (const status of statuses) {
    const filtered = arr.filter(([id, r]) => (r.status || 'unread') === status);
    if (filtered.length === 0 && status !== 'unread') continue;
    
    html += `<div class="admin-section-title">${statusLabels[status]} (${filtered.length})</div>`;
    
    for (const [id, r] of filtered) {
      const fromUser = users[r.from] || {};
      const isPremium = fromUser.premium === true;
      const premiumClass = isPremium ? 'premium-report premium-glow' : '';
      const premiumBadge = isPremium ? '<span class="premium-badge-small">👑 PREMIUM</span>' : '';
      
      html += `
        <div class="friend-item ${premiumClass}" style="margin-bottom:8px;position:relative;">
          <div class="friend-info" style="flex:1;">
            <div class="friend-nick">
              ${r.from} → ${r.about || '?'}
              ${premiumBadge}
            </div>
            <div class="friend-status" style="margin-top:4px;">📝 ${r.message || 'нет сообщения'}</div>
            <div class="friend-status" style="font-size:0.65rem;color:#555;">🕐 ${new Date(r.createdAt || 0).toLocaleString()}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <select class="admin-select" data-report="${id}">
              ${statuses.map(s => `<option value="${s}" ${(r.status || 'unread') === s ? 'selected' : ''}>${statusLabels[s]}</option>`).join('')}
            </select>
          </div>
        </div>
      `;
    }
  }
  
  container.innerHTML = html || '<div style="color:var(--muted);padding:20px;text-align:center;">репортов пока нет</div>';

  container.querySelectorAll('.admin-select').forEach(select => {
    select.addEventListener('change', async () => {
      await update(ref(db, `reports/${select.dataset.report}`), { status: select.value });
      showToast('статус репорта обновлён');
      renderReports(container);
    });
  });
}

// ========== СТАТИСТИКА ==========
function renderStats(container) {
  if (statsUnsubscribe) {
    statsUnsubscribe();
    statsUnsubscribe = null;
  }
  
  container.innerHTML = '<div style="color:var(--muted);">загрузка...</div>';
  
  statsUnsubscribe = onValue(ref(db, 'users'), async (snap) => {
    const users = snap.val() || {};
    const arr = Object.entries(users);
    
    const withStatus = await Promise.all(
      arr.map(async ([name, data]) => {
        const status = await checkUserOnlineStatus(name);
        return { name, data, status };
      })
    );
    
    const online = withStatus.filter(u => u.status === 'online');
    const premium = withStatus.filter(u => u.data.premium === true);
    
    container.innerHTML = `
      <div class="admin-section-title">📈 общая статистика</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;">
        <div class="stat-card" style="flex:1;"><div class="stat-num">${arr.length}</div><div class="stat-label">всего игроков</div></div>
        <div class="stat-card" style="flex:1;"><div class="stat-num" style="color:#4ade80;">${online.length}</div><div class="stat-label">онлайн</div></div>
        <div class="stat-card" style="flex:1;"><div class="stat-num" style="color:#facc15;">${premium.length}</div><div class="stat-label">премиум</div></div>
      </div>
      
      <div class="admin-section-title">🟢 онлайн сейчас</div>
      <div class="admin-online-list">
        ${online.length > 0 ? online.map(u => `
          <div class="admin-online-user">
            <span>${u.data.emoji || '😎'}</span>
            <span>${u.name}</span>
            ${u.data.premium ? '<span style="color:#facc15;margin-left:4px;">👑</span>' : ''}
          </div>
        `).join('') : '<div style="color:var(--muted);">никого нет</div>'}
      </div>
    `;
  });
}

// ========== АДМИНЫ ==========
async function renderAdmins(container) {
  container.innerHTML = '<div style="color:var(--muted);">загрузка...</div>';
  const usersSnap = await get(ref(db, 'users'));
  const users = usersSnap.val() || {};
  const admins = Object.entries(users).filter(([n, d]) => d.role && d.role !== 'user');
  
  container.innerHTML = `
    <div class="admin-section-title">👑 администраторы (${admins.length})</div>
    ${admins.map(([name, data]) => `
      <div class="friend-item">
        <div class="avatar">${data.emoji || '😎'}</div>
        <div class="friend-info"><div class="friend-nick">${name}</div><div class="friend-status">${roleLabel(data.role)}</div></div>
        ${myRole === 'owner' && data.role !== 'owner' ? `<button class="btn-remove" data-remove="${name}" title="снять админа"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
      </div>
    `).join('')}
    
    ${myRole === 'owner' ? `
      <div class="divider">➕ добавить админа</div>
      <div class="field"><input type="text" id="newAdminInput" placeholder="ник игрока..." autocomplete="off"></div>
      <div style="display:flex;gap:8px;">
        <select class="admin-select" id="newAdminRole" style="flex:1;">
          <option value="admin">админ</option>
          <option value="junior">младший админ</option>
        </select>
        <button class="btn" id="addAdminBtn" style="flex:1;">добавить</button>
      </div>
      <div class="error" id="adminError"></div>
    ` : ''}
  `;

  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (confirm('снять админа?')) {
        await update(ref(db, `users/${btn.dataset.remove}`), { role: null });
        showToast(`${btn.dataset.remove} больше не админ`);
        renderAdmins(container);
      }
    });
  });

  if (myRole === 'owner') {
    document.getElementById('addAdminBtn').addEventListener('click', async () => {
      const targetNick = document.getElementById('newAdminInput').value.trim().toLowerCase();
      const role = document.getElementById('newAdminRole').value;
      const errorEl = document.getElementById('adminError');
      if (!targetNick) return (errorEl.textContent = 'введи ник');
      const snap = await get(ref(db, `users/${targetNick}`));
      if (!snap.exists()) return (errorEl.textContent = 'игрок не найден');
      await update(ref(db, `users/${targetNick}`), { role: role });
      showToast(`${targetNick} теперь ${roleLabel(role)}`);
      document.getElementById('newAdminInput').value = '';
      renderAdmins(container);
    });
  }
}

function renderOwner(container) {
  container.innerHTML = `
    <div class="admin-section-title">⚡ панель владельца</div>
    <div class="friend-item" style="margin-bottom:8px;">
      <div class="friend-info"><div class="friend-nick">👑 ты владелец</div><div class="friend-status">полный доступ ко всем функциям</div></div>
    </div>
  `;
}

// ========== ЗАГРУЗКА РАЗДЕЛА ==========
async function loadSection(section) {
  if (section !== 'stats' && statsUnsubscribe) {
    statsUnsubscribe();
    statsUnsubscribe = null;
  }
  
  const content = document.getElementById('sectionContent');
  switch(section) {
    case 'users': await renderUsers(content); break;
    case 'reports': await renderReports(content); break;
    case 'stats': await renderStats(content); break;
    case 'admins': await renderAdmins(content); break;
    case 'owner': renderOwner(content); break;
    case 'functions': await renderFunctions(content); break;
  }
}

function renderAdmin() {
  const tabs = [
    { id: 'users', label: '👥 пользователи' },
    { id: 'reports', label: '🚩 репорты' },
    { id: 'stats', label: '📊 статистика' },
    { id: 'functions', label: '🔧 функции' },
    { id: 'admins', label: '👑 админы' },
    { id: 'owner', label: '⚡ владелец' }
  ];
  
  const filteredTabs = myRole === 'owner' ? tabs : tabs.filter(t => t.id !== 'owner');

  adminContent.innerHTML = `
    <div class="section-header" style="margin-bottom:20px;">
      <span class="section-icon">🛡️</span>
      <h2 class="section-title">админка</h2>
      <span class="admin-badge ${myRole}">${roleLabel(myRole)}</span>
    </div>
    
    <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
      ${filteredTabs.map(t => `<button class="btn ghost admin-tab" data-tab="${t.id}" style="flex:1;min-width:100px;font-size:0.75rem;padding:10px;">${t.label}</button>`).join('')}
    </div>
    
    <div id="sectionContent"></div>
  `;

  document.querySelectorAll('.admin-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentSection = btn.dataset.tab;
      document.querySelectorAll('.admin-tab').forEach(b => { b.style.background = ''; b.style.color = '#777'; });
      btn.style.background = '#1f1f1f';
      btn.style.color = '#f0f0f0';
      loadSection(currentSection);
    });
    if (btn.dataset.tab === currentSection) {
      btn.style.background = '#1f1f1f';
      btn.style.color = '#f0f0f0';
    }
  });

  loadSection(currentSection);
}

function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 2000);
}

document.getElementById('logoutBtn')?.addEventListener('click', async () => {
  await update(myRef, { online: false, status: 'offline', lastSeen: Date.now() });
  localStorage.removeItem('spark_user');
  window.location.href = '/';
});

checkAccess();
</script>
