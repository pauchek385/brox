<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROX | Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-ultra: #030106;
            --bg-sidebar: rgba(6, 3, 10, 0.99);
            --bg-card: rgba(18, 9, 32, 0.5);
            --accent: #9d4edd;
            --accent-glow: #c77dff;
            --coin: #ffcc00;
            --danger: #ff0055;
            --success: #00ff88;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.07);
            --text-main: #ffffff;
            --text-dim: #7d7d7d;
            --text-mute: #444;
            --sidebar-w: 280px;
            --radius-md: 18px;
            --transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-ultra);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Сайдбар */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-sidebar);
            backdrop-filter: blur(60px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 40px 25px;
            flex-shrink: 0;
            z-index: 100;
        }

        .brand-box { margin-bottom: 60px; }

        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 6px;
            text-align: center;
            background: linear-gradient(135deg, #fff 20%, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px rgba(157,78,221,0.3));
        }

        .nav-group { display: flex; flex-direction: column; gap: 6px; }

        .nav-link {
            padding: 14px 20px;
            border-radius: 16px;
            color: var(--text-dim);
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .nav-link:hover {
            color: #fff;
            background: var(--glass);
            border-color: var(--glass-border);
            transform: translateX(6px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(157,78,221,0.15), transparent);
            color: #fff;
            border-left: 4px solid var(--accent);
        }

        .nav-link i { font-style: normal; font-size: 18px; }
        .nav-divider { margin: 16px 0; height: 1px; background: var(--glass-border); }

        /* Main */
        .main {
            flex: 1;
            padding: 40px 50px;
            overflow-y: auto;
            height: 100vh;
        }

        .view-title {
            font-size: clamp(60px, 8vw, 120px);
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 0.85;
            margin-bottom: 30px;
            background: linear-gradient(to bottom, #fff 40%, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .access-denied {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-dim);
            font-size: 18px;
        }

        .access-denied .icon { font-size: 64px; margin-bottom: 20px; }

        /* Вкладки */
        .admin-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 12px 24px;
            border-radius: 99px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .admin-tab:hover { color: #fff; border-color: var(--glass-border); }
        .admin-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* Таблица пользователей */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .admin-table th, .admin-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            font-size: 14px;
        }

        .admin-table th {
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
        }

        /* Карточки статистики */
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 25px;
            text-align: center;
        }

        .stat-card .value { font-size: 36px; font-weight: 900; }
        .stat-card .label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }

        /* Кнопки */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: var(--accent-glow); }
        .btn-gold { background: linear-gradient(135deg, #facc15, #ff8c00); color: #000; }
        .btn-gold:hover { filter: brightness(1.1); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.8; }

        /* Модалка */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #13131c;
            border: 1px solid var(--accent-glow);
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
        }

        .modal-card h3 { color: var(--accent-glow); margin-bottom: 20px; text-align: center; }

        .modal-card input {
            width: 100%;
            padding: 12px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            margin-bottom: 12px;
            font-family: 'Inter', sans-serif;
        }

        .modal-card input:focus { border-color: var(--accent); outline: none; }

        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-admin { background: rgba(157,78,221,0.2); color: var(--accent-glow); }
        .badge-premium { background: rgba(255,204,0,0.2); color: var(--coin); }
        .badge-online { background: rgba(0,255,136,0.2); color: var(--success); }

        .toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #12121c;
            border: 1px solid #2a2a35;
            padding: 18px 28px;
            border-radius: 18px;
            color: #fff;
            z-index: 2000;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand-box"><div class="brand-logo">BROX</div></div>
    <nav class="nav-group">
        <a href="home.html" class="nav-link"><i>🏠</i> Home</a>
        <a href="discovery.html" class="nav-link"><i>🧭</i> Discovery</a>
        <a href="avatars.html" class="nav-link"><i>🛒</i> Avatar Shop</a>
        <a href="avatar.html" class="nav-link"><i>👤</i> Avatar</a>
        <div class="nav-divider"></div>
        <a href="inventory.html" class="nav-link"><i>🎒</i> Inventory</a>
        <a href="messages.html" class="nav-link"><i>✉️</i> Messages</a>
        <a href="settings.html" class="nav-link"><i>⚙️</i> Settings</a>
        <a href="broxs.html" class="nav-link"><i>🧪</i> Brox Studio</a>
        <a href="admin.html" class="nav-link active"><i>🛡️</i> Admin</a>
    </nav>
</div>

<div class="main">
    <div class="view-title">Admin Panel</div>
    <div id="adminContent"></div>
</div>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
        authDomain: "spark-9e768.firebaseapp.com",
        databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "spark-9e768",
        storageBucket: "spark-9e768.firebasestorage.app",
        messagingSenderId: "660066059407",
        appId: "1:660066059407:web:0d87f09259e53563555cfa"
    });

    const db = firebase.database();
    const currentUser = localStorage.getItem('spark_user');
    const adminContent = document.getElementById('adminContent');

    function pushToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    async function checkAccess() {
        const snap = await db.ref(`users/${currentUser}`).once('value');
        const data = snap.val() || {};
        const role = data.role;

        if (role === 'owner' || role === 'admin' || role === 'junior') {
            renderAdmin(role);
        } else {
            adminContent.innerHTML = `
                <div class="access-denied">
                    <div class="icon">⛔</div>
                    <h2>Доступ запрещён</h2>
                    <p>У вас нет прав администратора</p>
                </div>`;
        }
    }

    function renderAdmin(role) {
        adminContent.innerHTML = `
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="loadSection('users', this)">👥 Пользователи</button>
                <button class="admin-tab" onclick="loadSection('stats', this)">📊 Статистика</button>
                <button class="admin-tab" onclick="loadSection('functions', this)">🔧 Функции</button>
                ${role === 'owner' ? '<button class="admin-tab" onclick="loadSection(\'owner\', this)">⚡ Владелец</button>' : ''}
            </div>
            <div id="sectionContent"></div>`;

        loadSection('users');
    }

    async function loadSection(section, btn) {
        if (btn) {
            document.querySelectorAll('.admin-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        const content = document.getElementById('sectionContent');

        if (section === 'users') {
            const snap = await db.ref('users').once('value');
            const users = snap.val() || {};
            const arr = Object.entries(users);

            content.innerHTML = `
                <div style="font-size:14px;color:var(--text-dim);margin-bottom:20px;">Всего пользователей: ${arr.length}</div>
                <table class="admin-table">
                    <thead><tr><th>Ник</th><th>Роль</th><th>Премиум</th><th>Баланс</th><th>Статус</th></tr></thead>
                    <tbody>${arr.map(([name, data]) => `
                        <tr>
                            <td><strong>${name}</strong></td>
                            <td><span class="badge badge-admin">${data.role || 'игрок'}</span></td>
                            <td>${data.premium ? '<span class="badge badge-premium">👑 Prime</span>' : '—'}</td>
                            <td>${(data.brobux || 0).toLocaleString()} B</td>
                            <td>${data.online ? '<span class="badge badge-online">🟢 Онлайн</span>' : '⚫ Офлайн'}</td>
                        </tr>`).join('')}</tbody>
                </table>`;
        }
        else if (section === 'stats') {
            const snap = await db.ref('users').once('value');
            const users = snap.val() || {};
            const arr = Object.entries(users);
            const online = arr.filter(([n, d]) => d.online).length;
            const premium = arr.filter(([n, d]) => d.premium).length;

            content.innerHTML = `
                <div class="stat-cards">
                    <div class="stat-card"><div class="value" style="color:var(--accent-glow);">${arr.length}</div><div class="label">Всего игроков</div></div>
                    <div class="stat-card"><div class="value" style="color:#00ff88;">${online}</div><div class="label">Онлайн</div></div>
                    <div class="stat-card"><div class="value" style="color:#ffcc00;">${premium}</div><div class="label">Prime</div></div>
                </div>`;
        }
        else if (section === 'functions') {
            content.innerHTML = `
                <div style="display:grid; gap:20px;">
                    <div style="background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:25px;">
                        <h3 style="color:var(--accent-glow);margin-bottom:15px;">👑 Выдать Premium</h3>
                        <input type="text" id="premNick" placeholder="Ник игрока" style="width:100%;padding:12px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px;">
                        <input type="text" id="premDuration" placeholder="Срок (1w, 2w, 1m, 12m)" style="width:100%;padding:12px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px;">
                        <button class="btn btn-gold" onclick="grantPremium()">Выдать Premium</button>
                    </div>
                    <div style="background:var(--bg-card);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:25px;">
                        <h3 style="color:var(--accent-glow);margin-bottom:15px;">💰 Выдать BROBUX</h3>
                        <input type="text" id="buxNick" placeholder="Ник игрока" style="width:100%;padding:12px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px;">
                        <input type="number" id="buxAmount" placeholder="Сумма" style="width:100%;padding:12px;background:#1a1a2e;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:10px;">
                        <button class="btn btn-accent" onclick="grantBrobux()">Выдать BROBUX</button>
                    </div>
                </div>`;

            window.grantPremium = async function() {
                const nick = document.getElementById('premNick').value.trim();
                const dur = document.getElementById('premDuration').value.trim();
                if (!nick || !dur) return pushToast('Заполни все поля');
                await db.ref(`users/${nick}`).update({ premium: true, premiumDuration: dur });
                pushToast(`Premium выдан ${nick}`);
            };

            window.grantBrobux = async function() {
                const nick = document.getElementById('buxNick').value.trim();
                const amount = parseInt(document.getElementById('buxAmount').value);
                if (!nick || !amount) return pushToast('Заполни все поля');
                const snap = await db.ref(`users/${nick}/brobux`).once('value');
                const current = snap.exists() ? snap.val() : 0;
                await db.ref(`users/${nick}`).update({ brobux: current + amount });
                pushToast(`${amount} BROBUX выдано ${nick}`);
            };
        }
        else if (section === 'owner') {
            content.innerHTML = `
                <div class="stat-card"><div class="value" style="color:#ffcc00;">👑</div><div class="label">Панель владельца</div></div>
                <p style="margin-top:20px;color:var(--text-dim);">Полный доступ ко всем функциям</p>`;
        }
    }

    checkAccess();
</script>
</body>
</html>
