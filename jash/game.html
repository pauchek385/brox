<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>spark — дуэль</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .game-container { width: 100%; max-width: 500px; margin: 0 auto; text-align: center; }
    .game-bar { position: relative; width: 100%; height: 30px; background: #1a1a1a; border-radius: 15px; overflow: hidden; margin: 20px 0; border: 1px solid var(--border); }
    .game-bar::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.15); transform: translateX(-50%); z-index: 2; }
    .game-bar-fill { height: 100%; background: #f0f0f0; width: 50%; transition: width 0.05s linear; position: relative; z-index: 1; }
    .game-bar-left, .game-bar-right { position: absolute; top: -25px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    .game-bar-left { left: 0; } .game-bar-right { right: 0; }
    .click-btn { width: 100%; padding: 25px; font-size: 1.5rem; font-weight: 800; background: #f0f0f0; color: #0b0b0b; border: none; border-radius: 20px; cursor: pointer; transition: transform 0.05s; user-select: none; -webkit-tap-highlight-color: transparent; }
    .click-btn:active { transform: scale(0.95); background: #d0d0d0; }
    .game-timer-large { font-size: 3rem; font-weight: 900; margin: 10px 0; color: #f0f0f0; }
    .game-waiting { font-size: 1.5rem; font-weight: 600; color: var(--muted); }
    .game-result { font-size: 2rem; font-weight: 800; margin: 20px 0; }
  </style>
</head>
<body>

<div class="game-container">
  <div id="gameContent"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, get, update, onValue, set, runTransaction } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { startOnlineHeartbeat } from './app.js';

const firebaseConfig = {
  apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
  authDomain: "spark-9e768.firebaseapp.com",
  databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spark-9e768",
  storageBucket: "spark-9e768.firebasestorage.app",
  messagingSenderId: "660066059407",
  appId: "1:660066059407:web:0d87f09259e53563555cfa"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nick = localStorage.getItem('spark_user');
if (!nick) window.location.href = '/';

startOnlineHeartbeat(nick);

const urlParams = new URLSearchParams(window.location.search);
const duelId = urlParams.get('id');
if (!duelId) window.location.href = '/lobby';

const duelRef = ref(db, `duels/${duelId}`);
const myRef = ref(db, `users/${nick}`);

const STATE = { WAITING: 'waiting', COUNTDOWN: 'countdown', PLAYING: 'playing', FINISHED: 'finished' };
const MAX_DIFF = 30;
let mySide = null;
let opponentNick = null;
let clicks = 0;
let gameInterval = null;
let countdownInterval = null;
let statsUpdated = false;

async function init() {
  const snap = await get(duelRef);
  const duel = snap.val();
  if (!duel || duel.status !== 'accepted') {
    document.getElementById('gameContent').innerHTML = '<p>Дуэль не найдена или отменена</p>';
    return;
  }

  if (duel.from === nick) { mySide = 'from'; opponentNick = duel.to; }
  else if (duel.to === nick) { mySide = 'to'; opponentNick = duel.from; }
  else { document.getElementById('gameContent').innerHTML = '<p>Вы не участвуете в этой дуэли</p>'; return; }

  if (!duel.gameState) {
    await update(duelRef, { gameState: STATE.WAITING, [mySide + 'Ready']: true, fromClicks: 0, toClicks: 0, statsProcessed: false });
  } else {
    if (duel.gameState === STATE.WAITING) await update(duelRef, { [mySide + 'Ready']: true });
  }

  onValue(duelRef, (snap) => {
    const data = snap.val();
    if (!data) { window.location.href = '/lobby'; return; }

    if (data.gameState === STATE.WAITING && data.fromReady && data.toReady && mySide === 'from') {
      update(duelRef, { gameState: STATE.COUNTDOWN, countdown: 3 });
      return;
    }

    if (data.gameState === STATE.WAITING) renderWaiting();
    else if (data.gameState === STATE.COUNTDOWN) renderCountdown(data);
    else if (data.gameState === STATE.PLAYING) renderPlaying(data);
    else if (data.gameState === STATE.FINISHED) renderFinished(data);
  });
}

function renderWaiting() {
  document.getElementById('gameContent').innerHTML = `
    <div style="margin-top:40px;"><div class="game-waiting">Ожидание противника...</div><p style="color:var(--muted); margin-top:10px;">${opponentNick} ещё не готов</p></div>`;
}

function renderCountdown(data) {
  const cd = data.countdown || 3;
  document.getElementById('gameContent').innerHTML = `
    <div style="margin-top:60px;"><div class="game-timer-large" id="countdownDisplay">${cd}</div><p style="color:var(--muted);">приготовься кликать!</p></div>`;

  if (mySide === 'from' && !countdownInterval) {
    let count = cd;
    countdownInterval = setInterval(async () => {
      count--;
      if (count <= 0) { clearInterval(countdownInterval); countdownInterval = null; await update(duelRef, { gameState: STATE.PLAYING, timeLeft: 40 }); }
      else await update(duelRef, { countdown: count });
    }, 1000);
  }
}

function renderPlaying(data) {
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

  const fromClicks = data.fromClicks || 0;
  const toClicks = data.toClicks || 0;
  const diff = fromClicks - toClicks;
  let fromPercent = 50 + (diff / MAX_DIFF) * 50;
  fromPercent = Math.max(0, Math.min(100, fromPercent));
  const timeLeft = data.timeLeft || 40;

  if (diff >= MAX_DIFF) { update(duelRef, { gameState: STATE.FINISHED, winner: data.from }); return; }
  else if (diff <= -MAX_DIFF) { update(duelRef, { gameState: STATE.FINISHED, winner: data.to }); return; }

  document.getElementById('gameContent').innerHTML = `
    <div style="margin-top:20px;">
      <div class="game-bar">
        <div class="game-bar-left">${data.from}</div><div class="game-bar-right">${data.to}</div>
        <div class="game-bar-fill" style="width:${fromPercent}%;"></div>
      </div>
      <div class="game-timer-large" id="timeDisplay">${timeLeft}с</div>
      <button class="click-btn" id="clickBtn">КЛИКАТЬ!</button>
    </div>`;

  const clickBtn = document.getElementById('clickBtn');
  
  clickBtn.addEventListener('click', async () => {
    clickBtn.style.transform = 'scale(0.95)';
    setTimeout(() => { clickBtn.style.transform = ''; }, 100);
    
    const clickRef = ref(db, `duels/${duelId}/${mySide + 'Clicks'}`);
    await runTransaction(clickRef, (currentClicks) => {
      return (currentClicks || 0) + 1;
    });
  });

  if (mySide === 'from' && !gameInterval) {
    gameInterval = setInterval(async () => {
      const snap = await get(duelRef);
      const duel = snap.val();
      if (duel.gameState !== STATE.PLAYING) { clearInterval(gameInterval); gameInterval = null; return; }
      const newTime = Math.max(0, duel.timeLeft - 1);
      if (newTime <= 0) {
        clearInterval(gameInterval); gameInterval = null;
        const fC = duel.fromClicks || 0; const tC = duel.toClicks || 0;
        let winner;
        if (fC > tC) winner = duel.from;
        else if (tC > fC) winner = duel.to;
        else winner = 'draw';
        await update(duelRef, { gameState: STATE.FINISHED, winner: winner });
      } else await update(duelRef, { timeLeft: newTime });
    }, 1000);
  }
}

async function renderFinished(data) {
  clearInterval(gameInterval); gameInterval = null;
  clearInterval(countdownInterval); countdownInterval = null;

  const winner = data.winner;
  let resultText = ''; 
  let resultClass = '';

  // ТОЛЬКО ОДИН ИГРОК ОБНОВЛЯЕТ СТАТИСТИКУ
  if (!data.statsProcessed && mySide === 'from') {
    await update(duelRef, { statsProcessed: true });
    
    if (winner !== 'draw') {
      const winnerNick = winner;
      const loserNick = winner === data.from ? data.to : data.from;
      
      // Обновляем победителя
      const winnerRef = ref(db, `users/${winnerNick}`);
      const winnerSnap = await get(winnerRef);
      const winnerData = winnerSnap.val() || {};
      await update(winnerRef, {
        wins: (winnerData.wins || 0) + 1,
        rating: (winnerData.rating || 1000) + 25
      });
      
      // Обновляем проигравшего
      const loserRef = ref(db, `users/${loserNick}`);
      const loserSnap = await get(loserRef);
      const loserData = loserSnap.val() || {};
      await update(loserRef, {
        losses: (loserData.losses || 0) + 1,
        rating: Math.max(0, (loserData.rating || 1000) - 25)
      });
      
      console.log(`[DEBUG] Статистика обновлена: ${winnerNick} победил, ${loserNick} проиграл`);
    }
  }

  if (winner === nick) { 
    resultText = 'ТЫ ПОБЕДИЛ! 🏆'; 
    resultClass = 'result-win'; 
  }
  else if (winner === 'draw') { 
    resultText = 'НИЧЬЯ! 🤝'; 
    resultClass = '';
  }
  else { 
    resultText = 'ТЫ ПРОИГРАЛ 💀'; 
    resultClass = 'result-lose'; 
  }

  document.getElementById('gameContent').innerHTML = `
    <div style="margin-top:40px;">
      <div class="game-result ${resultClass}">${resultText}</div>
      <p style="color:var(--muted);">${data.from} ${data.fromClicks || 0} : ${data.toClicks || 0} ${data.to}</p>
      <button class="btn mt-2" onclick="window.location.href='/lobby'">в лобби</button>
    </div>`;
  setTimeout(() => { set(duelRef, null); }, 60000);
}

init();
</script>
</body>
</html>
