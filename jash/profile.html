<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>spark — профиль</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Маленький баланс в правом углу */
    .corner-balance {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(26, 26, 26, 0.8);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid #2a2a2a;
      z-index: 10;
    }
    .corner-balance-icon {
      font-size: 0.8rem;
    }
    .corner-balance-label {
      font-size: 0.6rem;
      color: #6b8cae;
      letter-spacing: 0.5px;
    }
    .corner-balance-amount {
      font-size: 0.9rem;
      font-weight: 700;
      color: #facc15;
    }
    .corner-balance-amount small {
      font-size: 0.6rem;
      font-weight: 400;
      color: #6b8cae;
    }

    .profile-content {
      position: relative;
    }

    .sidebar-balance {
      margin-top: auto;
      padding: 12px;
      background: #0f0f0f;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .balance-label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .balance-amount {
      font-size: 0.9rem;
      font-weight: 600;
    }
    .premium-sidebar-note {
      font-size: 0.55rem;
      color: #444;
      text-align: center;
      margin-top: 8px;
      font-style: italic;
    }
    .premium-super-badge {
      background: linear-gradient(135deg, #facc15, #ff8c00);
      border-radius: 30px;
      padding: 4px 12px;
      font-size: 0.65rem;
      font-weight: 700;
      color: #0b0b0b;
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="layout">
  
  <div class="sidebar">
    <div class="sidebar-logo">spark</div>
    <a href="/profile" class="sidebar-item active">
      <span class="sidebar-icon">😎</span>
      <span>профиль</span>
    </a>
    <a href="/friends" class="sidebar-item">
      <span class="sidebar-icon">🍋‍🟩</span>
      <span>друзья</span>
    </a>
    <a href="/lobby" class="sidebar-item">
      <span class="sidebar-icon">⚔️</span>
      <span>лобби</span>
    </a>
    <div class="sidebar-divider"></div>
    <a href="/reports" class="sidebar-item">
      <span class="sidebar-icon">🚩</span>
      <span>репорты</span>
    </a>
    <a href="/shop" class="sidebar-item">
      <span class="sidebar-icon">👑</span>
      <span>PSS</span>
    </a>
    <a href="/admin" class="sidebar-item" id="adminSidebarLink" style="display:none;">
      <span class="sidebar-icon">🛡️</span>
      <span>админка</span>
    </a>
    
    <div class="sidebar-balance">
      <div class="balance-label">
        <span>👑</span> СТАТУС
      </div>
      <div class="balance-amount" id="premiumStatusDisplay">не куплен</div>
    </div>
    <div class="premium-sidebar-note" id="premiumNote" style="display:none;">теперь все обновления ты будешь видеть первым</div>
    
    <button class="sidebar-item" id="logoutBtn" style="color:#f87171;">
      <span class="sidebar-icon">🚪</span>
      <span>выйти</span>
    </button>
  </div>

  <div class="main">
    <div class="profile-content">
      
      <!-- МАЛЕНЬКИЙ БАЛАНС В ПРАВОМ УГЛУ -->
      <div class="corner-balance">
        <span class="corner-balance-icon">⚡</span>
        <span class="corner-balance-label">SC</span>
        <span class="corner-balance-amount" id="sparkBalance">0</span>
      </div>

      <div class="profile-head">
        <div class="profile-avatar" id="profileAvatar"></div>
        <div class="profile-info">
          <h1 class="profile-nick" id="profileNick"></h1>
          <div class="profile-status">
            <span class="status-dot" id="profileStatusDot"></span>
            <span class="profile-status-text" id="profileStatusText"></span>
          </div>
          <div id="premiumBadge" style="display:none;">
            <div class="premium-super-badge">👑 СУПЕР МЕГА КРУТОЙ ПРЕМИУМ ИГРОК 👑</div>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-icon">🏆</span>
          <span class="stat-num" id="statWins">0</span>
          <span class="stat-label">побед</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💀</span>
          <span class="stat-num" id="statLosses">0</span>
          <span class="stat-label">поражений</span>
        </div>
        <div class="stat-card">
          <span class="stat-icon">⭐</span>
          <span class="stat-num" id="statRating">1000</span>
          <span class="stat-label">рейтинг</span>
        </div>
      </div>

      <div class="friends-count-block" id="friendsCountBlock">
        <span class="friends-count-icon">🍋‍🟩</span>
        <div>
          <div class="friends-count-num" id="friendsCountNum">0</div>
          <div class="friends-count-label">друзей</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, update, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { startOnlineHeartbeat } from './app.js';

const firebaseConfig = {
  apiKey: "AIzaSyAr8MamzQhhvUjZ1VIWvytRheHWjNtiRIM",
  authDomain: "spark-9e768.firebaseapp.com",
  databaseURL: "https://spark-9e768-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "spark-9e768",
  storageBucket: "spark-9e768.firebasestorage.app",
  messagingSenderId: "660066059407",
  appId: "1:660066059407:web:0d87f09259e53563555cfa"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nick = localStorage.getItem('spark_user');
if (!nick) window.location.href = '/';

const myRef = ref(db, `users/${nick}`);

startOnlineHeartbeat(nick);

async function initSparkCoins(data) {
  if (data.sparkCoins === undefined || data.sparkCoins === null) {
    await update(myRef, { sparkCoins: 2500 });
    return 2500;
  }
  return data.sparkCoins;
}

function formatNumber(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function updatePremiumUI(data) {
  const isPremium = data.premium === true;
  const statusDisplay = document.getElementById('premiumStatusDisplay');
  const premiumNote = document.getElementById('premiumNote');
  const badge = document.getElementById('premiumBadge');
  const nickElement = document.getElementById('profileNick');
  const avatarElement = document.getElementById('profileAvatar');
  
  if (isPremium) {
    statusDisplay.innerHTML = 'активирован 👑';
    statusDisplay.style.color = '#facc15';
    premiumNote.style.display = 'block';
    if (badge) badge.style.display = 'block';
    
    nickElement.classList.add('premium-nick');
    nickElement.innerHTML = '<span class="premium-icon"></span>' + (data.nick || nick);
    
    avatarElement.style.border = '2px solid #facc15';
    avatarElement.style.boxShadow = '0 0 15px rgba(250, 204, 21, 0.5)';
  } else {
    statusDisplay.innerHTML = 'не куплен';
    statusDisplay.style.color = '#f87171';
    premiumNote.style.display = 'none';
    if (badge) badge.style.display = 'none';
    
    nickElement.classList.remove('premium-nick');
    nickElement.innerHTML = data.nick || nick;
    
    avatarElement.style.border = '2px solid #2a2a2a';
    avatarElement.style.boxShadow = 'none';
  }
}

onValue(myRef, async (snap) => {
  if (!snap.exists()) return;
  const data = snap.val();
  
  const sparkCoins = await initSparkCoins(data);
  document.getElementById('sparkBalance').textContent = formatNumber(sparkCoins);
  
  updatePremiumUI(data);
  
  document.getElementById('profileAvatar').textContent = data.emoji || '😎';
  
  const dot = document.getElementById('profileStatusDot');
  const text = document.getElementById('profileStatusText');
  dot.className = 'status-dot';
  
  if (data.status === 'online') {
    dot.classList.add('online');
    text.textContent = 'в сети';
  } else if (data.status === 'afk') {
    dot.classList.add('afk');
    text.textContent = 'афк';
  } else {
    dot.classList.add('offline');
    text.textContent = 'не в сети';
  }
  
  document.getElementById('statWins').textContent = data.wins || 0;
  document.getElementById('statLosses').textContent = data.losses || 0;
  document.getElementById('statRating').textContent = data.rating || 1000;
  
  const friends = data.friends || {};
  document.getElementById('friendsCountNum').textContent = Object.keys(friends).length;

  if (data.role === 'owner' || data.role === 'admin' || data.role === 'junior') {
    document.getElementById('adminSidebarLink').style.display = 'flex';
  }
});

document.getElementById('friendsCountBlock').addEventListener('click', () => {
  window.location.href = '/friends';
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await update(myRef, { online: false, status: 'offline', lastSeen: Date.now() });
  localStorage.removeItem('spark_user');
  window.location.href = '/';
});
</script>
</body>
</html>
